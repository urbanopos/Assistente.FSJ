<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'self' 'unsafe-inline';style-src 'self' 'unsafe-inline';img-src 'self' data:;connect-src https://awrxnzbfrsaurzpunuko.supabase.co"><title>Início • Fazenda São José</title><link rel="icon" href="./icon-512.png"><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5ee;color:#193e2b;font:16px system-ui,Arial,sans-serif}main{max-width:600px;margin:auto;padding:14px}.panel{background:white;border-radius:18px;overflow:hidden;box-shadow:0 6px 28px #1b3f2920}header{background:#e6f2e6;padding:15px;display:flex;gap:12px;align-items:center}header img{width:55px;height:55px}h1{font-size:23px;margin:0}h2{font-size:20px;margin:10px 0}.body{padding:16px}.nav{display:flex;align-items:center;gap:10px;margin:18px 0}.nav button{background:#205b42;color:white;border:0;border-radius:12px;min-width:48px;min-height:50px;font-size:24px}.nav button:disabled{opacity:.4}.nav .item{flex:1;min-height:100px;border:2px solid #bdd4c4;border-radius:14px;padding:14px;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:8px}.nav a{color:#135b3c;font-weight:700;font-size:18px}.topline{display:flex;justify-content:space-between;align-items:center;gap:8px}.topline a{font-size:24px;text-decoration:none;color:#19553c;padding:8px}.hint{color:#536b5b;font-size:14px}#status{color:#9a2323}footer{text-align:center;font-size:12px;padding:18px;color:#627064}@media(min-width:701px){main{margin-top:30px}}
</style></head><body><main><div class="panel"><header><img src="./icon-512.png" alt="Logotipo FSJ"><div><h1>Fazenda São José</h1><strong>INÍCIO DO USUÁRIO</strong></div></header><div class="body"><div class="topline"><span id="person">Identificando usuário...</span><a href="./inicio-usuario.html" id="home" aria-label="Página inicial" title="Início">⌂</a></div><p class="hint">Use as setas para percorrer os itens disponíveis ao seu perfil.</p><div class="nav"><button id="prev" type="button" aria-label="Item anterior">←</button><div class="item"><h2 id="name">Aguarde...</h2><div id="detail"></div></div><button id="next" type="button" aria-label="Próximo item">→</button></div><p id="counter" class="hint"></p><p id="status" role="status"></p></div></div><footer>© 2026 UPCJr. Fazenda São José</footer></main><script>
(()=>{'use strict';
const token=new URLSearchParams(location.hash.slice(1)).get('token')||'';const status=document.getElementById('status'),person=document.getElementById('person'),name=document.getElementById('name'),detail=document.getElementById('detail'),counter=document.getElementById('counter'),prev=document.getElementById('prev'),next=document.getElementById('next'),home=document.getElementById('home');let items=[],index=0;
function show(){const x=items[index];name.textContent=x?.label||'Nenhuma seção disponível';detail.replaceChildren();if(x){const a=document.createElement('a');a.href=x.url;a.textContent='Abrir '+x.label;detail.append(a);}counter.textContent=items.length?'Item '+(index+1)+' de '+items.length:'';prev.disabled=index===0;next.disabled=index>=items.length-1;}
prev.onclick=()=>{if(index>0){index--;show();}};next.onclick=()=>{if(index<items.length-1){index++;show();}};home.onclick=e=>{e.preventDefault();index=0;show();};
if(!/^[0-9a-f-]{36}$/i.test(token)){status.textContent='Acesso individual inválido. Abra o link recebido pelo WhatsApp.';show();return;}
const board='./quadro.html#token='+encodeURIComponent(token);items=[{label:'Minhas tarefas',url:board}];show();
fetch('https://awrxnzbfrsaurzpunuko.supabase.co/functions/v1/resposta-tarefa',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'board',token})}).then(async r=>{const data=await r.json();if(!r.ok)throw Error(data.erro||'Acesso inválido');person.textContent='Usuário: '+data.responsavel;items=[{label:'Minhas tarefas',url:board}];if(!data.visitante){items.push({label:'Solicitar folga semanal',url:board});}show();status.textContent='';}).catch(e=>{items=[];show();status.textContent=e.message;person.textContent='Acesso não autorizado';});
})();
</script></body></html>
