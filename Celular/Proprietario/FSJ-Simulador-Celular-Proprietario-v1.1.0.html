const text=(label,key,value='')=>`<label for="f-${key}">${label}</label><div class="text-voice"><textarea id="f-${key}" data-field="${key}" rows="2">${esc(drafts[key]??value)}</textarea><button type="button" class="voice" data-voice="${key}" aria-label="Simular voz: ${label}">Voz</button></div>`;
const input=(label,key,type='text',value='')=>`<label for="f-${key}">${label}</label><div class="${type==='text'?'text-voice':'field'}"><input id="f-${key}" data-field="${key}" type="${type}" ${type==='file'?(key==='restoreFile'?'accept=".json,application/json"':'multiple accept="image/*,video/*,audio/*"'):`value="${esc(drafts[key]??value)}"`}>${type==='text'?`<button type="button" class="voice" data-voice="${key}" aria-label="Simular voz: ${label}">Voz</button>`:''}</div>`;
const select=(label,key,options)=>`<label for="f-${key}">${label}</label><select id="f-${key}" data-field="${key}">${options.map(v=>`<option value="${esc(v)}" ${(drafts[key]??options[0])===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`;
const people=()=>[...new Set(state.people.map(p=>p.name))];
const mine=()=>state.tasks.filter(t=>assigned(t,me)&&(canHistory||active(t)));
const under=()=>state.tasks.filter(t=>t.supervision&&(canHistory||active(t)));
const current=()=>state.tasks.find(t=>t.id===selected)||state.tasks[0];
const rows=(list,ctx='execution')=>list.length?list.map(t=>`<button type="button" class="code" data-task="${esc(t.id)}" data-context="${ctx}" data-state="${esc(t.state)}" data-priority="${!!t.priority}">${esc(t.id)} <span class="task-status">· ${esc(t.state)}</span></button>`).join(''):'<p>Nenhuma tarefa nesta seleção.</p>';
function capture(){main.querySelectorAll('[data-field]').forEach(e=>{if(e.type==='file'){drafts[e.dataset.field]=[...e.files].map(f=>f.name).join(', ');}else drafts[e.dataset.field]=e.type==='checkbox'?e.checked:e.value;});persist();}
function persist(){state.drafts=drafts;try{localStorage.setItem(storageKey,JSON.stringify(state));return true;}catch{return false;}}
function say(s,error=false){notice.textContent=s;notice.dataset.error=String(error);main.__fsjFit?.layout();}
function log(action,t=current()){state.logs.push({task:t.id,who:me+' · '+cfg.label,when:new Date().toLocaleString('pt-BR',{timeZone:'America/Recife'}),action});persist();}
function allowed(dest){if(['maintenance','backup','access'].includes(dest))return owner;if(['register','reports','people','groups','stock','approvals','automatic','emergency','returns','suggestions','edit'].includes(dest))return manager;if(dest==='supervision')return manager||supervisor;if(dest==='thirds')return manager||supervisor;return true;}
function navigate(dest,ctx){if(!allowed(dest)){say('Função indisponível para este perfil.',true);return;}capture();history.push({view,selected,context});view=dest;if(ctx)context=ctx;message='';render();}
function back(){capture();const old=history.pop();if(old){view=old.view;selected=old.selected;context=old.context;}else view='home';message='';render();}
function required(key,label='Preencha este campo.'){capture();if(!String(drafts[key]||'').trim()){say(label,true);main.querySelector(`[data-field="${key}"]`)?.focus();return false;}return true;}
function discussion(t){const list=state.threads[t.id]||[];return `<h3>Dúvidas e respostas</h3>${list.length?list.map((q,i)=>`<div class="item"><p>${esc(q.who)} · ${esc(q.when)}</p><p>${esc(q.body)}</p>${q.replies.map(r=>`<p><strong>${esc(r.who)}</strong> · ${esc(r.when)}<br>${esc(r.body)}</p>`).join('')}${manager||supervisor?button('Responder esta dúvida',`data-reply="${i}"`,'secondary'):''}</div>`).join(''):'<p>Nenhuma dúvida registrada nesta tarefa.</p>'}${text('Dúvida / pedido sobre esta tarefa','question_'+t.id)}${act('Registrar dúvida / pedido','taskQuestion')}`;}
function timeline(t){const logs=state.logs.filter(l=>l.task===t.id);return '<h3>Registros da tarefa</h3>'+(logs.length?logs.map(l=>`<div class="item"><p>${esc(l.when)} · ${esc(l.who)}</p><p>${esc(l.action)}</p></div>`).join(''):'<p>Ainda não há registros nesta simulação.</p>');}
function menu(){
 let content=go('TV FSJ','tv','wide')+go('Minhas tarefas','mine');
 if(manager){content+=go('Registrar demanda','register')+go('Tarefas de terceiros','thirds')+go('Folgas e férias','leaves')+go('Relatórios','reports')+go('Pessoas e perfis','people')+go('Disparo emergencial','emergency')+go('Disparo automático','automatic')+(owner?go('Painel de manutenção','maintenance','wide'):'')+go('Grupos','groups')+go('Armazenagem','stock')+go('Avisos de devolução','returns','wide secondary');}
 else{content+=go('Folgas e férias','leaves');if(supervisor)content+=go('SUPERVISÃO','supervision','wide gold');}
 let counts='';if(cfg.platform==='Desktop-Laptop'&&manager){counts=`<div class="counts">${button('Em aberto · '+state.tasks.filter(t=>t.state==='Aberta').length,'data-filter="Aberta"','secondary')}${button('Em execução · '+state.tasks.filter(t=>t.state==='Em execução').length,'data-filter="Em execução"','secondary')}${button('Aguardando gestor · '+state.tasks.filter(t=>t.state==='Aguardando gestor').length,'data-filter="Aguardando gestor"','secondary')}${button('Suspensas · '+state.tasks.filter(t=>t.state==='Suspensa').length,'data-filter="Suspensa"','secondary')}</div>`;}

 case 'approvals':title='Aprovar solicitações';html=state.leaves.map(l=>`<div class="item"><p>${esc(l.person)} · ${esc(l.date)} · ${esc(l.type)}</p><p>${esc(l.state)}</p>${text('Motivo da decisão','leaveReason_'+l.id)}<div class="pair">${button('Aprovar',`data-leave="${l.id}" data-decision="Aprovada"`)}${button('Rejeitar',`data-leave="${l.id}" data-decision="Rejeitada"`,'secondary')}</div></div>`).join('');break;

 case 'people':title='Pessoas e perfis';html=state.people.map(p=>`<p>${esc(p.name)} · ${esc(p.role)}</p>`).join('')+input('Nome','personName')+input('Telefone','personPhone')+select('Perfil','personRole',owner?['Executor','Supervisor','Gestor','Visitante']:['Executor','Supervisor','Visitante'])+act('Salvar pessoa','savePerson')+go('Grupos','groups','secondary')+(owner?go('Delegações e acessos','access','secondary'):'<p>Delegação de Gestor e administração técnica são exclusivas do Proprietário.</p>');break;

 case 'delete':title='Excluir tarefa';html=`<p>Excluir ${t.id} da lista simulada? O registro ficará no histórico.</p>`+act('Confirmar exclusão','confirmDelete')+act('Cancelar','cancel','secondary');break;

function reportResult(){const list=state.tasks.filter(t=>(!drafts.reportPerson||drafts.reportPerson==='Todas'||t.person===drafts.reportPerson)&&(!drafts.reportState||drafts.reportState==='Todas'||t.state===drafts.reportState)&&(!drafts.reportPeriod||drafts.reportPeriod==='Todas'||t.period===drafts.reportPeriod)&&(!drafts.reportStart||t.created>=drafts.reportStart)&&(!drafts.reportEnd||t.created<=drafts.reportEnd));return '<h3>Fazenda São José · Relatório simulado</h3>'+(list.map(t=>`<div class="item"><p><strong>${esc(t.id)}</strong> · ${esc(t.person)}</p><p>${esc(t.state)} · ${esc(t.period)} · ${esc(t.created)}</p><p>Tempo · R/I: ${esc(t.ri)} · E/C: ${esc(t.ec)}</p>${timeline(t)}</div>`).join('')||'<p>Nenhum registro na seleção.</p>');}
function download(blob,filename){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}

 if(['start','confirmSuspend','yes','no'].includes(a)){

 if(a==='start'){
 if(t.state==='Em execução'){say('Esta tarefa já está em execução.');return;}
 state.tasks.filter(x=>x.id!==t.id&&assigned(x,me)&&x.state==='Em execução').forEach(x=>{x.state='Suspensa';x.reason='Início de outra tarefa';log('Suspensão automática pelo início de outra tarefa',x);});
 t.state='Em execução';t.ri=t.ri==='—'?'0h00':t.ri;t.ec='Em curso';log('Iniciou / retomou a tarefa');message='Simulação: início registrado com data, hora e agente.'+(t.off?' Atenção: o executor está de folga.':'');render();return;
 }
 if(a==='suspend'){navigate('suspend');return;}
 if(a==='confirmSuspend'){if(!required('suspend_'+t.id,'Informe a justificativa da suspensão.'))return;t.reason=drafts['suspend_'+t.id];t.state='Suspensa';t.ec='Pausado';log('Suspendeu: '+t.reason);view='task';message='Simulação: suspensão registrada com justificativa.';render();return;}
 if(a==='finish'){navigate('finish');return;}
 if(a==='yes'||a==='no'){
 if(a==='no'&&!required('finish_'+t.id,'Informe o motivo da não conclusão.'))return;
 t.reason=a==='no'?(drafts['finish_'+t.id]||''):'';t.attachments=a==='no'?(drafts['attachments_'+t.id]||''):'';
 t.delivered=a==='yes'&&!!t.requiresAcceptance;t.state=a==='no'?'Aguardando gestor':t.delivered?'Aguardando gestor':'Concluída';t.ec='0h40';
 log(a==='yes'?(t.delivered?'Entregou para aceite':'Concluiu a tarefa'):'Registrou não conclusão: '+t.reason);
 view=!canHistory&&t.state==='Concluída'?'mine':'task';history=[];message='Simulação: '+(t.state==='Concluída'?'conclusão registrada; tarefa retirada da lista do executor.':t.delivered?'entrega encaminhada ao supervisor para aceite.':'não conclusão registrada e encaminhada à gestão.');if(t.off)message+=' Atenção: executor em folga.';render();return;
 }
 if(a==='accept'&&(manager||supervisor)&&context==='supervision'){if(!t.delivered){say('Esta tarefa não aguarda aceite.',true);return;}t.state='Concluída';t.delivered=false;log('Aceitou a conclusão');view='supervision';message='Simulação: aceite registrado; tarefa concluída.';render();return;}
 if(a==='confirmReturn'&&(manager||supervisor)){if(!required('return_'+t.id,'Informe a justificativa da devolução.'))return;t.state='Suspensa';t.delivered=false;t.reason=drafts['return_'+t.id];const rec={task:t.id,person:t.person,reason:t.reason,when:new Date().toLocaleString('pt-BR')};state.returns.push(rec);log('Devolveu ao executor: '+t.reason);view='supervision';message='Simulação: devolução registrada e aviso incluído para o Proprietário.';render();return;}
 if(a==='edit'&&manager){editing=true;drafts.taskTitle=t.title;drafts.taskPerson=t.person;drafts.taskPeriod=t.period;navigate('register');return;}
 if(a==='delete'&&manager){navigate('delete');return;}
 if(a==='confirmDelete'&&manager){log('Excluiu da lista simulada, preservando este registro');state.tasks=state.tasks.filter(x=>x.id!==t.id);view='mine';history=[];message='Simulação: tarefa retirada da lista.';render();return;}
 if(a==='archive'&&manager){if(t.state!=='Concluída')return;t.state='Arquivada';log('Arquivou a tarefa');message='Simulação: tarefa arquivada, com histórico preservado.';render();return;}
 if(a==='saveTask'&&manager){if(!required('taskTitle','Preencha a descrição.'))return;if(editing){Object.assign(t,{title:drafts.taskTitle,person:drafts.taskPerson||people()[0],period:drafts.taskPeriod||'Única',priority:(drafts.taskPriority||'Normal')!=='Normal'});log('Editou a tarefa');}else{const created={id:nextTaskId(),title:drafts.taskTitle,person:drafts.taskPerson||people()[0],state:'Aberta',period:drafts.taskPeriod||'Única',priority:(drafts.taskPriority||'Normal')!=='Normal',ri:'—',ec:'—',created:'2026-11-01',deadline:drafts.taskDeadline||''};state.tasks.push(created);log('Criou a tarefa simulada',created);}message='Simulação: tarefa salva. Consulte a relação de tarefas.';render();return;}
 if(a==='taskQuestion'||a==='reply'||a==='guidance'){
 if(context==='consultation')return;const key=a==='taskQuestion'?'question_'+t.id:a==='reply'?'reply_'+t.id+'_'+questionIndex:'guidance_'+t.id;
 if(!required(key,'Preencha a mensagem por texto ou voz.'))return;const record={who:me,when:new Date().toLocaleString('pt-BR'),body:drafts[key]};
 if(a==='reply'){if(!manager&&!supervisor)return;const q=state.threads[t.id]?.[questionIndex];if(!q)return;q.replies.push(record);}else(state.threads[t.id]??=[]).push({...record,replies:[]});log('Registrou '+(a==='reply'?'resposta':'mensagem')+': '+drafts[key]);delete drafts[key];view='info';message='Simulação: mensagem registrada apenas nesta tarefa.';render();return;
 }
 if(a==='suggest'){if(!required('suggestion','Digite sua sugestão.'))return;state.suggestions.push({id:Date.now(),person:me,text:drafts.suggestion,state:'Pendente'});delete drafts.suggestion;message='Simulação: sugestão encaminhada para análise do Proprietário.';render();return;}
 if(a==='communicate'){if(!required('communication'))return;log('Comunicação à gestão: '+drafts.communication);say('Simulação: comunicação registrada, sem envio externo.');return;}
 if(a==='saveLeave'){
 if(!required('leaveStart','Escolha a data inicial.'))return;const end=drafts.leaveEnd||drafts.leaveStart;if(end<drafts.leaveStart){say('A data final deve ser igual ou posterior à inicial.',true);return;}
 state.leaves.push({id:Date.now(),person:manager?(drafts.leavePerson||people()[0]):me,date:drafts.leaveStart,end,type:drafts.leaveType||'Folga semanal',state:manager?'Registrada':'Aguardando aprovação'});view='leaves';message='Simulação: datas salvas no calendário deste perfil.';render();return;
 }
 if(a==='report'&&manager){if(drafts.reportStart&&drafts.reportEnd&&drafts.reportStart>drafts.reportEnd){say('Corrija o período do relatório.',true);return;}drafts.reportReady=true;message='Relatório de dados fictícios gerado.';render();return;}
 if(a==='clearReport'){for(const k of Object.keys(drafts))if(k.startsWith('report'))delete drafts[k];render();return;}
 if(a==='savePerson'&&manager){if(!required('personName','Informe o nome.'))return;const role=drafts.personRole||'Executor';if(!owner&&['Gestor','Proprietário'].includes(role))return;state.people.push({name:drafts.personName,role});message='Simulação: pessoa e perfil registrados.';render();return;}
 if(a==='saveAccess'&&owner){const p=state.people.find(p=>p.name===drafts.accessPerson);if(p)p.role=drafts.accessRole||'Executor';say('Simulação: delegação registrada. Não concede acesso ao sistema real.');return;}
 if(a==='saveGroup'&&manager){if(!required('groupName'))return;state.groups.push({name:drafts.groupName,members:drafts.groupMembers||''});message='Simulação: grupo salvo.';render();return;}
 if(a==='saveStock'&&manager){if(!required('stockName'))return;const amount=Number(drafts.stockAmount);if(!Number.isFinite(amount)||amount<0){say('Informe uma quantidade válida.',true);return;}state.stock.push({name:drafts.stockName,amount});message='Simulação: item registrado.';render();return;}
 if(a==='send'&&manager){if(!drafts.emergencyPerson||drafts.emergencyPerson==='Selecione'){say('Selecione o destinatário.',true);return;}if(!required('emergencyMessage'))return;const off=drafts.emergencyPerson==='Executor B';root.querySelector('#emergency-result').innerHTML=(off?'<p class="status">O destinatário executor (Executor B) está de folga (compensação, feriado, folga semanal, etc).</p>':'')+'<p><strong>Prévia simulada</strong></p><p>'+esc(drafts.emergencyPerson)+'</p><p>'+esc(drafts.emergencyMessage)+'</p>';say('Simulação: o sistema prepararia a conversa do destinatário. Nenhuma mensagem foi enviada.');return;}
 if(a==='auto'&&manager){if(!state.automatic.enabled){const recipients=people().filter(p=>drafts['auto_'+p]);if(!recipients.length){say('Escolha pelo menos um destinatário.',true);return;}if(!drafts.autoTime){say('Escolha o horário.',true);return;}state.automatic={enabled:true,people:recipients,time:drafts.autoTime};}else state.automatic.enabled=false;message='Simulação: rotina '+(state.automatic.enabled?'ativada':'desativada')+'. Nenhum agendamento real foi criado.';render();return;}
 if(a==='video'||a==='play'){if(a==='play'){video=drafts.video||state.videos[0];playing=true;}else playing=!playing;if(!playing)video='Institucional FSJ';message=playing?'Demonstração visual de reprodução; nenhum vídeo real é acessado.':'Retorno ao institucional simulado.';render();return;}
 if(a==='saveVideo'&&manager){if(!required('videoTitle','Informe o título.'))return;state.videos.push(drafts.videoTitle);message='Simulação: vídeo incluído na lista demonstrativa.';render();return;}
 if(a==='diagnostic'&&owner){say('Simulação: verificaria serviços, versões, conexões e logs.');return;}
 if(a==='saveCopy'){saveCopy();return;}
 if(a==='exportState'){download(new Blob([JSON.stringify({config:cfg,state},null,2)],{type:'application/json'}),'FSJ-Simulador-'+cfg.platform+'-'+cfg.role+'-dados.json');return;}
 if(a==='restore'&&owner){const f=main.querySelector('[data-field="restoreFile"]')?.files[0];if(!f){say('Selecione o JSON exportado pelo simulador.',true);return;}try{const d=JSON.parse(await f.text());if(d.config?.role!==cfg.role||d.config?.platform!==cfg.platform||!valid(d.state))throw Error();state=d.state;drafts=state.drafts;view='home';history=[];message='Dados fictícios restaurados neste simulador.';render();}catch{say('Arquivo incompatível. Use os dados deste perfil e plataforma.',true);}return;}
 if(a==='resetPrompt'){navigate('reset');return;}
 if(a==='reset'){state=seed();drafts=state.drafts;view='home';history=[];message='Dados fictícios reiniciados.';render();return;}
 if(a==='cancel'){back();return;}
});
render();
})();
