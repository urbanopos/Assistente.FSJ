name: Compilar Agente FSJ Android (teste)
on:
  workflow_dispatch:
  push:
    paths:
      - 'agente-android/**'
      - '.github/workflows/agente-android.yml'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar APK de teste
        run: gradle -p agente-android --no-daemon assembleDebug
      - name: Publicar APK de teste no site
        run: |
          mkdir -p downloads
          cp agente-android/app/build/outputs/apk/debug/app-debug.apk downloads/agente-fsj-teste.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/agente-fsj-teste.apk
          git diff --cached --quiet || (git commit -m "Publicar APK Android FSJ de teste [skip ci]" && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: agente-fsj-android-teste
          path: agente-android/app/build/outputs/apk/debug/app-debug.apk
