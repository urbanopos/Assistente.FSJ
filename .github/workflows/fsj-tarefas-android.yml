name: Compilar APK Assistente FSJ Tarefas
on:
  workflow_dispatch:
  push:
    paths:
      - 'fsj-tarefas-android/**'
      - '.github/workflows/fsj-tarefas-android.yml'
permissions:
  contents: write
concurrency:
  group: fsj-tarefas-android
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar APK
        run: gradle -p fsj-tarefas-android --no-daemon assembleDebug
      - name: Publicar APK
        run: |
          mkdir -p downloads
          cp fsj-tarefas-android/app/build/outputs/apk/debug/app-debug.apk downloads/assistente-fsj-tarefas-teste.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/assistente-fsj-tarefas-teste.apk
          git diff --cached --quiet || (git commit -m "Publicar APK FSJ Tarefas [skip ci]" && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: assistente-fsj-tarefas-apk
          path: fsj-tarefas-android/app/build/outputs/apk/debug/app-debug.apk
