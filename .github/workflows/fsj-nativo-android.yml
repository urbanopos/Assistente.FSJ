name: Compilar FSJ Tarefas Android Nativo
on:
  workflow_dispatch:
  push:
    paths:
      - 'app-nativo-android/**'
      - '.github/workflows/fsj-nativo-android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar
        run: gradle -p app-nativo-android --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FSJ-Tarefas-Nativo-Android-TESTE
          path: app-nativo-android/app/build/outputs/apk/debug/app-debug.apk
