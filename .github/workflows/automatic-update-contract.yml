name: Protecao da atualizacao automatica
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contrato-atualizacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar atualizacao automatica e impedir ciclo de recarga
        run: |\n          node tests/automatic-update-contract.cjs\n          node tests/automatic-update-contract.cjs desktop/index.html\n          node tests/owner-dashboard-sync.cjs
