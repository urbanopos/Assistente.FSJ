name: Regressão de prazos de tarefas
on:
  push:
    branches: [main]
    paths:
      - index.html
      - celular/ocorrencias-proprietario.js
      - tests/periodos-vencimentos.cjs
      - .github/workflows/periodos-vencimentos.yml
  pull_request:
    paths:
      - index.html
      - celular/ocorrencias-proprietario.js
      - tests/periodos-vencimentos.cjs
      - .github/workflows/periodos-vencimentos.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  limites-dos-prazos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/periodos-vencimentos.cjs
