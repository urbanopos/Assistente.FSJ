name: contrato-fsj
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contrato-fsj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar contrato de arquitetura sem acessar produção
        run: node --test tests/contrato-arquitetura-fsj.cjs
