name: Publicar instalador FSJ Android
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publicar-instalador-fsj.yml'
permissions:
  actions: read
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Baixar APK Android validado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/fsj-apk downloads
          gh run download 41604124970 -R urbanopos/Assistente.FSJ -n FSJ-Web-Piloto-Android -D /tmp/fsj-apk
          find /tmp/fsj-apk -type f
          cp /tmp/fsj-apk/app-debug.apk downloads/Assistente-FSJ-Android.apk
          unzip -t downloads/Assistente-FSJ-Android.apk | tail -1
      - name: Publicar APK no GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Assistente-FSJ-Android.apk
          git commit -m "Publicar APK Android FSJ" || exit 0
          git push origin HEAD:main
