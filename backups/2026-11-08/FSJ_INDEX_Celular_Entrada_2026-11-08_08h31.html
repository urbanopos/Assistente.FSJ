<p><a id="open" href="../index.html">Abrir Assistente FSJ</a></p>
<script>
/* Entrada isolada para teste: conserva query e hash (inclusive token de acesso).
   Reutiliza a aplicação existente, sem modificar perfis ou registros. */
(function(){
  const target=new URL('../index.html',location.href);

  target.hash=location.hash;
  document.getElementById('open').href=target.href;
  location.replace(target.href);
})();
</script>
