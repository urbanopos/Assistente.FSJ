<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Cache-Control" content="no-store"><title>FSJ — Identificando acesso</title><style>body{font:17px system-ui,sans-serif;background:#f3f8f5;color:#17432e;max-width:480px;margin:60px auto;padding:20px;text-align:center}</style></head><body><h2>Fazenda São José</h2><p id="status">Identificando o perfil autorizado...</p><script>
(async()=>{'use strict';const status=document.getElementById('status');const token=new URLSearchParams(location.hash.slice(1)).get('token');if(!token){status.textContent='Link individual não identificado.';return}const api='https://awrxnzbfrsaurzpunuko.supabase.co/functions/v1/';async function post(fn,data){const r=await fetch(api+fn,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.erro||'Não foi possível validar o acesso');return j}try{const d=await post('resposta-tarefa',{action:'board',token});if(d.visitante||d.simulador){location.replace('./visitante.html');return}const role=String(d.perfil||d.categoria||d.tipo_perfil||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();let route=/proprietari|titular/.test(role)?'proprietario':/supervisor/.test(role)?'supervisor':/executor|funcionari|participante/.test(role)?'executor':'';if(route==='executor'){try{const s=await post('supervisao',{action:'available',token});if(s.ativo===true)route='supervisor'}catch{}}if(!route)throw Error('Perfil não identificado pela base de acesso.');const dest=new URL('./celular/'+route+'/index.html',location.href);dest.hash='token='+encodeURIComponent(token);location.replace(dest.href)}catch(e){status.textContent='Não foi possível abrir o Index: '+e.message}})();
</script></body></html>
