<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Cache-Control" content="no-store"><title>FSJ — Identificando acesso</title><style>body{font:17px system-ui,sans-serif;background:#f3f8f5;color:#17432e;max-width:480px;margin:60px auto;padding:20px;text-align:center}</style></head><body><h2>Fazenda São José</h2><p id="status">Identificando o perfil autorizado...</p><script>
(async()=>{'use strict';const status=document.getElementById('status');try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(reg=>reg.scope.startsWith(location.origin+'/Assistente.FSJ/')).map(reg=>reg.unregister()))}if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>/fsj|assistente|github/i.test(k)).map(k=>caches.delete(k)))}}catch(e){console.warn('Atualização de cache indisponível',e)}const token=new URLSearchParams(location.hash.slice(1)).get('token');if(!token){status.textContent='Link individual não identificado.';return}const api='https://awrxnzbfrsaurzpunuko.supabase.co/functions/v1/';async function post(fn,data){const r=await fetch(api+fn,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.erro||'Não foi possível validar o acesso');return j}try{const d=await post('fsj-index-identidade',{token});const role=String(d.perfil||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();let route=d.proprietario?'proprietario':/gestor/.test(role)?'gestor':d.supervisao?'supervisor':/supervisor/.test(role)?'supervisor':/executor|funcionari|participante/.test(role)?'executor':/visitante/.test(role)?'visitante':'';if(route==='visitante'){location.replace('./visitante.html');return}if(!route)throw Error('Perfil não identificado pela base de acesso.');const dest=new URL('./celular/layouts/'+route+'/index.html',location.href);dest.searchParams.set('fsj_atualizacao',String(Date.now()));dest.hash='token='+encodeURIComponent(token);location.replace(dest.href)}catch(e){status.textContent='Não foi possível abrir o Index: '+e.message}})();
</script></body></html>
