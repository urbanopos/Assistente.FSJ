<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FSJ — Desktop Lateral (Consulta Experimental)</title><style>:root{font-family:Arial,sans-serif;color:#17304b;background:#f1f7fa}*{box-sizing:border-box}body{margin:0}.top{height:64px;background:#dff3fb;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #b9d6e2}.brand{font-weight:800;color:#063b63}.status{font-size:12px;color:#355b6b}.shell{display:flex;min-height:calc(100vh - 64px)}aside{background:#083450;color:white;width:248px;flex-shrink:0;padding:12px;transition:width .2s}aside.collapsed{width:64px}aside button{width:100%;background:transparent;color:white;border:0;border-radius:7px;text-align:left;padding:13px 12px;cursor:pointer;font-size:14px;margin-bottom:4px}aside button:hover,aside button.active{background:#b7dfff;color:#063450}aside.collapsed .label{display:none}main{padding:24px;flex:1;min-width:0}.card{background:white;border:1px solid #c3dce8;border-radius:12px;padding:22px;max-width:1200px;margin:auto}.row{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.pill{display:inline-block;background:#eef5fa;color:#205271;padding:7px 12px;border-radius:20px;font-size:12px}.hint{background:#f3f9fc;border:1px solid #c8dfe9;padding:15px;border-radius:8px;line-height:1.6}.sections{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:20px}.section{border:1px solid #cbdfe8;border-radius:8px;padding:17px;min-height:125px}.section h3{font-size:15px;margin:0 0 10px}.section p{font-size:13px;line-height:1.5;color:#527083}.control{border:1px solid #9cb9c8;border-radius:6px;padding:10px;background:#fff;color:#254d64;cursor:pointer}.control:disabled{opacity:.5;cursor:not-allowed}.muted{color:#597383;font-size:13px}.footer{margin-top:24px;color:#57707c;font-size:12px}@media(max-width:680px){aside{width:66px}aside .label{display:none}main{padding:10px}.top{padding:8px;height:auto;min-height:64px}}</style></head><body><header class="top"><div><div class="brand">🌿 Fazenda São José — Assistente FSJ</div><div class="status">Desktop Proprietário • Navegação lateral experimental</div></div><span class="pill">CONSULTA VISUAL · SEM GRAVAÇÃO</span></header><div class="shell"><aside id="menu"><button onclick="toggleMenu()" title="Recolher/expandir menu">☰ <span class="label">Recolher menu</span></button><div id="links"></div></aside><main><div class="card"><div class="row"><h2 id="title">Painel Geral</h2><span class="pill" id="count"></span></div><div class="hint" id="intro"></div><div class="sections" id="content"></div><div class="footer">Protótipo isolado: dados reais, autenticação e ações operacionais não foram conectados. O aplicativo oficial permanece inalterado.</div></div></main></div><script>const items=[['Painel Geral','Visão geral de tarefas, avisos e indicadores','Indicadores','Atividades recentes','Alertas'],['Minhas Tarefas','Consulta das tarefas atribuídas ao perfil','Tarefas em aberto','Tarefas em execução','Pendências'],['Tarefas em Execução','Consulta das tarefas ativas, individuais e de grupo','Filtro por executor individual','Filtro por grupo executor','Lista e histórico'],['Tarefas de Terceiros','Consulta das tarefas de outros executores conforme permissões','Executor individual','Grupo executor','Situação'],['Tarefas de Grupo','Consulta de demandas compartilhadas','Grupos cadastrados','Tarefas do grupo','Participantes'],['Tarefas Não Cumpridas','Consulta de tarefas com prazo vencido','Individuais','De grupo','Prazos'],['Registrar Tarefa','Prévia da tela de cadastro, sem permitir inserir registros','Responsáveis','Descrição e prioridade','Periodicidade'],['Pessoas','Consulta visual da ficha de pessoas','Identificação e contato','Supervisão e jornada','Férias e calendário'],['Grupos','Consulta dos grupos de executores','Grupos','Integrantes','Tarefas vinculadas'],['Folgas e Férias','Consulta visual do calendário de folgas e férias','Calendário mensal','Funcionários','Feriados'],['Relatórios','Prévia das áreas de relatórios','Filtros','Período','Situação'],['TV FSJ','Prévia do acesso à TV FSJ','Painel de acesso','Programação','Avisos'],['Diagnóstico','Prévia da área exclusiva do Proprietário','Verificações','Histórico','Ocorrências']];let active=0;const links=document.getElementById('links');function render(){links.innerHTML=items.map((it,i)=>'<button class="'+(i===active?'active':'')+'" title="'+it[0]+'" onclick="go('+i+')"><span>▸ </span><span class="label">'+it[0]+'</span></button>').join('');const x=items[active];document.getElementById('title').textContent=x[0];document.getElementById('count').textContent=(active+1)+' / '+items.length;document.getElementById('intro').textContent=x[1]+'. Esta é uma representação para teste de navegação, não uma consulta ao banco de dados.';document.getElementById('content').innerHTML=x.slice(2).map(s=>'<div class="section"><h3>'+s+'</h3><p>Área reservada à futura integração somente de leitura, com as permissões do Proprietário.</p><button class="control" disabled>Consultar (em preparação)</button></div>').join('');}function go(i){active=i;render();history.replaceState(null,'','#secao='+encodeURIComponent(items[i][0]));}function toggleMenu(){document.getElementById('menu').classList.toggle('collapsed')}let h=decodeURIComponent(location.hash.replace(/^#secao=/,''));let i=items.findIndex(x=>x[0]===h);if(i>=0)active=i;render();</script></body></html>
