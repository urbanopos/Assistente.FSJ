<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assistente FSJ encerrado</title><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f4f8f5;color:#163e2a;font:16px system-ui,sans-serif;padding:20px;box-sizing:border-box}main{max-width:460px;text-align:center;background:white;border-radius:16px;padding:24px;box-shadow:0 2px 14px #0001}button{background:#176341;color:white;border:0;border-radius:10px;padding:14px 28px;font:700 18px system-ui;cursor:pointer}p{line-height:1.5}small{color:#555}</style></head><body><main><h1>Assistente FSJ encerrado</h1><p>A tela principal foi descarregada. Seus registros e seu acesso foram preservados.</p><button type="button" id="fechar">FECHAR APLICATIVO</button><p id="instrucoes" role="status">Toque em FECHAR APLICATIVO. Se o Samsung não permitir, siga a orientação exibida.</p><small>Em celulares Samsung, o Android pode exigir que você feche a janela pela lista de aplicativos recentes.</small></main><script>document.getElementById('fechar').onclick=()=>{document.getElementById('instrucoes').textContent='Se esta tela permanecer aberta: abra Aplicativos recentes (três linhas na parte inferior, ou deslize de baixo para cima e segure) e deslize a janela do Assistente FSJ para cima. Os três pontinhos do Chrome não fecham o aplicativo.';try{window.close()}catch(e){};};</script></body></html>
