<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://awrxnzbfrsaurzpunuko.supabase.co; img-src 'self' data:"><meta property="og:type" content="website"><meta property="og:title" content="Tarefas do dia • Fazenda São José"><meta property="og:description" content="Toque para abrir o quadro colorido e acessar cada tarefa."><meta property="og:image" content="https://urbanopos.github.io/Assistente.FSJ/quadro-preview.png"><meta property="og:image:width" content="443"><meta property="og:image:height" content="221"><meta name="twitter:card" content="summary_large_image"><title>Quadro de tarefas • Fazenda São José</title><link rel="icon" href="./icon-512.png"><style>
*{box-sizing:border-box}body{margin:0;background:#f0f4ed;color:#213d2d;font-family:system-ui,Arial,sans-serif}main{max-width:620px;margin:18px auto;padding:0 12px}.board{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 8px 32px #193f2820}.top{background:#eaf4e9;padding:28px 28px 35px}.brand{display:flex;align-items:center;gap:15px}.brand img{width:64px;height:64px}.brand h1{font-size:29px;margin:0;color:#193c2a;line-height:1.1}.brand strong{color:#846c1c;font-size:15px;letter-spacing:.04em}.meta{font-size:19px;font-weight:700;margin-top:26px}.meta p{margin:6px 0}.stripe{background:#dec078;padding:17px 28px;font-weight:800;font-size:24px;letter-spacing:.02em}.tasks{padding:18px 22px 12px}.task{display:flex;align-items:center;gap:14px;margin:12px 0;padding:14px;border:2px solid #bed5c2;border-radius:15px;text-decoration:none;color:#145d3e;background:#fbfdfb;min-height:86px}.task:hover,.task:focus{background:#e9f5e9;border-color:#268150;outline:none}.num{background:#235d41;color:#fff;border-radius:12px;min-width:47px;height:47px;display:grid;place-items:center;font-size:20px;font-weight:800}.name{font-size:20px;font-weight:750;line-height:1.25;text-decoration:underline;text-underline-offset:3px}.status{font-size:12px;color:#657568;margin-left:auto}.foot{padding:8px 28px 28px;color:#80681c;font-weight:750}.foot small{display:block;color:#687668;font-weight:400;margin-top:5px}#error{color:#8b2424;padding:20px}#content{display:none}@media(max-width:480px){.brand h1{font-size:24px}.meta{font-size:17px}.stripe{font-size:21px}.name{font-size:18px}.task{min-height:74px}}
</style></head><body><main><div class="board"><div class="top"><div class="brand"><img src="./icon-512.png" alt=""><div><h1>Fazenda São José</h1><strong>GESTÃO DE TAREFAS</strong></div></div><div id="meta" class="meta"></div></div><div class="stripe">TAREFAS DO DIA</div><div id="content"><div id="tasks" class="tasks"></div><div class="foot">NOMES COM LINKS ATIVOS<small>Toque no nome da tarefa para abrir seu formulário individual.</small></div></div><div id="error" role="status">Carregando quadro...</div></div></main><script>
const token=new URLSearchParams(location.hash.slice(1)).get('token')||'';
async function load(){const error=document.getElementById('error');if(!token){error.textContent='Link inválido. Solicite o quadro do dia ao gestor.';return}try{const r=await fetch('https://awrxnzbfrsaurzpunuko.supabase.co/functions/v1/resposta-tarefa',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'board',token})});const d=await r.json();if(!r.ok)throw Error(d.erro||'Não foi possível abrir o quadro.');const [y,m,day]=d.dia.split('-');const date=day+'/'+m+'/'+y;document.getElementById('meta').innerHTML='';const p1=document.createElement('p'),p2=document.createElement('p');p1.textContent='Data: '+date+' • '+new Date(d.criado_em).toLocaleTimeString('pt-BR',{timeZone:'America/Fortaleza',hour:'2-digit',minute:'2-digit'});p2.textContent='Responsável: '+d.responsavel;document.getElementById('meta').append(p1,p2);const target=document.getElementById('tasks');target.replaceChildren();if(!d.tarefas.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='Todas as tarefas do dia foram concluídas.';target.append(empty)}d.tarefas.forEach((t,i)=>{const a=document.createElement('a');a.className='task';a.href='./responder.html#token='+encodeURIComponent(t.token);a.setAttribute('aria-label',t.tarefa+' — abrir formulário');const num=document.createElement('span');num.className='num';num.textContent=String(i+1).padStart(2,'0');const name=document.createElement('span');name.className='name';name.textContent=t.tarefa;a.append(num,name);if(t.respondido){const s=document.createElement('span');s.className='status';s.textContent='Respondida';a.append(s)}target.append(a)});error.style.display='none';document.getElementById('content').style.display='block'}catch(e){error.textContent=e.message}}
load();document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script></body></html>
