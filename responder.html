<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://awrxnzbfrsaurzpunuko.supabase.co; img-src 'self' data:; form-action 'none'">
<title>Responder tarefa • Fazenda São José</title><link rel="icon" href="./icon-512.png">
<style>
:root{font:17px system-ui,Arial;color:#213d2c;background:#f2f5ef}*{box-sizing:border-box}body{margin:0}header{background:#174b3b;color:white;padding:20px}header b{font-size:23px}main{max-width:650px;margin:18px auto;padding:0 14px}.card{background:white;border-radius:16px;padding:21px;box-shadow:0 3px 18px #173d2818;margin-bottom:15px}h1{font-size:25px;margin:0 0 8px}h2{font-size:19px;margin:0 0 8px}.muted{color:#667268;font-size:14px}.task{background:#ecf5ec;border-left:6px solid #23714b;padding:14px;border-radius:8px;font-size:21px;font-weight:700}.choices{display:flex;gap:12px;margin:15px 0}.choices label{flex:1;border:2px solid #d4e2d6;border-radius:12px;text-align:center;padding:15px;font-size:22px;font-weight:700;cursor:pointer}.choices label:has(input:checked){border-color:#1b704a;background:#e8f6ed}.choices input{accent-color:#176341}textarea,input[type=file]{width:100%;font:inherit}textarea{padding:12px;border:1px solid #bccfc0;border-radius:10px;min-height:105px}button{border:0;border-radius:10px;padding:12px 15px;background:#176341;color:white;font:inherit;cursor:pointer}button.secondary{background:#e5eee7;color:#234b35}button:disabled{opacity:.55}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}#status{padding:8px 0;min-height:25px}#form,#done{display:none}small{color:#617168}
</style></head><body><header><b>🏡 Fazenda São José</b><div>Resposta individual de tarefa</div></header><main>
<div class="card"><h1>Tarefa do dia</h1><div id="status" role="status">Carregando tarefa...</div><div id="detail"></div></div>
<div id="form" class="card"><h2>Você realizou esta tarefa?</h2><div class="choices"><label><input type="radio" name="resposta" value="sim"> SIM</label><label><input type="radio" name="resposta" value="nao"> NÃO</label></div><label for="why"><b>Justificativa ou observação</b></label><textarea id="why" maxlength="2000" placeholder="Obrigatória quando a resposta for NÃO"></textarea><div class="buttons"><button type="button" class="secondary" id="listen">🔊 Ouvir tarefa</button><button type="button" class="secondary" id="dictate">🎙 Ditar justificativa</button></div><label for="files"><b>Foto, vídeo ou áudio (opcional)</b></label><input id="files" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm,audio/mpeg,audio/mp4,audio/ogg,audio/webm" multiple><small>Até 3 arquivos, no máximo 10 MB cada.</small><div class="buttons"><button id="send">Enviar resposta</button></div></div>
<div id="done" class="card"><h2>Resposta registrada</h2><p>Obrigado. Sua resposta foi encaminhada à gestão.</p></div>
</main><script>
const endpoint='https://awrxnzbfrsaurzpunuko.supabase.co/functions/v1/resposta-tarefa';
const token=new URLSearchParams(location.hash.slice(1)).get('token')||'';
history.replaceState(null,'',location.pathname);
const status=document.getElementById('status'),detail=document.getElementById('detail'),form=document.getElementById('form'),done=document.getElementById('done'),why=document.getElementById('why'),files=document.getElementById('files');
let info=null;
function fail(s){status.textContent=s}
async function post(body){const r=await fetch(endpoint,{method:'POST',body:JSON.stringify(body),headers:{'Content-Type':'application/json'}});const d=await r.json();if(!r.ok)throw Error(d.erro||'Falha ao carregar');return d}
async function load(){if(!token){fail('Link inválido. Peça um novo link ao gestor.');return}try{info=await post({action:'detail',token});status.textContent='';const title=document.createElement('div');title.className='task';title.textContent=info.tarefa;const meta=document.createElement('p');meta.className='muted';const [y,m,d]=info.dia.split('-');meta.textContent='Responsável: '+info.responsavel+' • Data: '+d+'/'+m+'/'+y;detail.append(meta,title);if(info.respondido)done.style.display='block';else form.style.display='block'}catch(e){fail(e.message)}}
document.getElementById('listen').onclick=()=>{if(!speechSynthesis){fail('Leitura em voz indisponível neste aparelho.');return}speechSynthesis.cancel();const s=new SpeechSynthesisUtterance(info.tarefa);s.lang='pt-BR';s.rate=.85;speechSynthesis.speak(s)};
document.getElementById('dictate').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){fail('Ditado indisponível neste navegador. Digite a justificativa.');return}const r=new R();r.lang='pt-BR';r.onresult=e=>{why.value=(why.value+' '+e.results[0][0].transcript).trim()};r.start()};
document.getElementById('send').onclick=async()=>{const selected=document.querySelector('input[name=resposta]:checked');if(!selected){fail('Escolha SIM ou NÃO.');return}if(selected.value==='nao'&&!why.value.trim()){fail('Explique o motivo da resposta NÃO.');why.focus();return}if(files.files.length>3||[...files.files].some(f=>f.size>10485760)){fail('Selecione até 3 arquivos de no máximo 10 MB cada.');return}const b=document.getElementById('send');b.disabled=true;status.textContent='Enviando resposta...';try{const data=new FormData();data.append('action','submit');data.append('token',token);data.append('resposta',selected.value);data.append('justificativa',why.value.trim());for(const f of files.files)data.append('arquivo',f);const r=await fetch(endpoint,{method:'POST',body:data});const d=await r.json();if(!r.ok)throw Error(d.erro||'Falha no envio');form.style.display='none';done.style.display='block';status.textContent=d.anexos_nao_salvos?.length?'Resposta registrada, mas alguns anexos falharam: '+d.anexos_nao_salvos.join(', '):''}catch(e){fail(e.message);b.disabled=false}};
load();
</script></body></html>
