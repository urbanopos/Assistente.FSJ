<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Cache-Control" content="no-store"><title>Assistente FSJ — Gestor · Celular</title>
<style>body{font:16px system-ui,sans-serif;margin:0;background:#f0f5f1;color:#193e2a}header{background:#e4f1e6;text-align:center;padding:18px 12px;border-bottom:2px solid #276341}main{max-width:520px;margin:auto;padding:16px}h1{font-size:21px;margin:0}h2{font-size:18px}button,a.link{box-sizing:border-box;border:0;border-radius:9px;background:#246a3b;color:white;padding:13px;font:600 15px system-ui,sans-serif;text-align:center;display:block;width:100%;text-decoration:none}button:disabled{opacity:.5}select{width:100%;padding:11px;border-radius:8px;border:1px solid #a6bba9}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid button{min-height:60px}#consulta{margin:0;padding:10px;box-shadow:none}#consulta .fsjGestorFiltros button{min-height:44px}#consultaConteudo>p{font-size:14px;margin:8px 0}#consultaConteudo strong{font-size:14px}#consultaConteudo>div>div{font-size:14px}#panel>.card{margin-top:6px}#status[hidden]{display:none}.note{font-size:13px;color:#526858}.card{background:white;border-radius:13px;padding:14px;margin:14px 0;box-shadow:0 1px 5px #0001}#status{padding:12px;background:#fff6df;border-radius:8px}.fsjCalendarGrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center;margin:8px 0}.fsjCalendarGrid>strong{font-size:12px;padding:7px 0}.fsjCalendarDay{padding:10px 0;border-radius:8px;font-weight:700;font-size:14px}.fsjCalendarDay.work{background:#c8e8c5;color:#184c29}.fsjCalendarDay.off{background:#185b34;color:white}.fsjCalendarDay.holiday{background:#efcf6a;color:#513d0c}.fsjCalendarDay.vacation{background:#2461a8;color:white}.fsjCalendarLegend{font-size:12px;line-height:1.4}.fsjGestorHeader{display:flex;align-items:center;gap:12px;text-align:left;max-width:520px;margin:auto}.fsjGestorHeader img{width:48px;height:48px;object-fit:contain}.fsjGestorHeader h1{font-size:19px}.fsjGestorHeader small{font-size:12px}</style></head>
<body><header><div class="fsjGestorHeader"><img src="../../../fsj-logotipo.webp" alt="Logotipo FSJ"><div><h1>Fazenda São José</h1><small>Assistente FSJ · Gestor</small></div></div></header>
<main><p id="status" role="status">Validando identidade e habilitações...</p><div id="panel" hidden><div class="card"><h2 id="name">Perfil Gestor</h2><p class="note">Acesso operacional conforme autorização do Proprietário. Administração técnica indisponível.</p><div id="inicioGestor"><div id="tvTop"></div><div id="numeroLinks" class="grid" style="margin:9px 0"></div><div id="buttons" class="grid"></div></div><section id="consulta" class="card" hidden><h2 id="consultaTitulo"></h2><div id="consultaConteudo"></div><button type="button" id="voltar" style="margin-top:12px">Voltar</button></section></div></div><p class="note">O acesso é individual e não depende do horário. Nenhuma função é liberada sem validação das permissões.</p></main>
<script>
(async function(){
'use strict';
const status=document.getElementById('status'),panel=document.getElementById('panel'),buttons=document.getElementById('buttons');
const token=new URLSearchParams(location.hash.slice(1)).get('token');
if(!token){status.textContent='Link individual não identificado.';return}
async function post(name,data){const response=await fetch('https://awrxnzbfrsaurzpunuko.supabase.co/functions/v1/'+name,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const value=await response.json();if(!response.ok)throw Error(value.erro||'Acesso não autorizado');return value}
try{
const identity=await post('fsj-index-identidade',{token});
if(identity.proprietario===true||!/gestor/i.test(identity.perfil||''))throw Error('Este link não pertence a um Gestor autorizado.');
document.getElementById('name').textContent=identity.nome||identity.identificacao||'Gestor';
const permissions=identity.gestor_permissoes||identity.gestorPermissoes||identity.permissoes_gestor;
if(!permissions||!Array.isArray(permissions.consulta)){status.textContent='Identidade confirmada. As permissões individuais ainda não são fornecidas pelo serviço de acesso. Nenhum botão operacional foi liberado por segurança.';panel.hidden=false;return}
const allowed=permissions.consulta.filter(x=>typeof x==='string');
const technical=/armazenagem|manuten|configura|administra|permiss|seguranca/i;
const modules=[['Início','dashboard'],['Comunicação','comunicacao'],['Disparo Emergencial','disparoEmergencial'],['Folgas e feriados','folgasGestor'],['Minhas tarefas','minhasTarefas'],['Pessoas e Grupos','cadPessoas'],['Registrar tarefa','cadDemanda'],['Relatórios','relatorios'],['Tarefas em Execução','tarefasEmExecucao'],['Vídeos e chamadas — TV FSJ','tv']];
const visible=modules.filter(([label])=>allowed.includes(label)&&!technical.test(label));
const tvTop=document.getElementById('tvTop');
panel.hidden=false;status.textContent='Perfil validado. '+visible.length+' área(s) operacional(is) autorizada(s).';
if(!visible.length){buttons.textContent='Nenhuma área operacional habilitada.';return}
for(const [label] of visible){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{if(label==='Vídeos e chamadas — TV FSJ'){b.disabled=true;status.textContent='Validando acesso à TV FSJ...';try{const result=await post('fsj-tv-espectador-acesso',{action:'issue',token});if(typeof result.code!=='string'||!/^[A-Za-z0-9_-]{42,640}$/.test(result.code))throw Error('Código de acesso indisponível');location.assign('https://168.196.84.147:9443/espectador#acesso='+encodeURIComponent(result.code));}catch(e){status.textContent='Não foi possível abrir a TV FSJ: '+e.message;b.disabled=false;}return;}if(label==='Folgas e feriados'||label==='Tarefas em Execução'){await abrirConsulta(label);return;}status.textContent='Área '+label+' autorizada; formulário ainda não integrado.'};(label==='Vídeos e chamadas — TV FSJ'?tvTop:buttons).appendChild(b)}

async function abrirConsulta(area){const view=document.getElementById('consulta'),body=document.getElementById('consultaConteudo');document.getElementById('inicioGestor').hidden=true;document.getElementById('name').hidden=true;status.hidden=true;document.getElementById('consultaTitulo').textContent=area;view.hidden=false;body.textContent='Consultando registros autorizados...';status.textContent='Consulta operacional: '+area;try{const mes=new Date().toLocaleDateString('en-CA',{timeZone:'America/Recife',year:'numeric',month:'2-digit'}).slice(0,7);const data=await post('fsj-gestor-consulta',{token,area,mes});body.replaceChildren();if(area==='Tarefas em Execução'){const rows=data.registros||[];const tabs=document.createElement('div');tabs.className='fsjGestorFiltros';tabs.style.cssText='display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:10px 0';const count=document.createElement('p'),list=document.createElement('div'),pager=document.createElement('nav');pager.setAttribute('aria-label','Navegação das tarefas');pager.style.cssText='display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0';body.append(tabs,count,list,pager);let page=0;const pageSize=5;const types=[['periodicas','Tarefas Periódicas'],['pontuais','Tarefas Pontuais'],['grupo','Tarefas de Grupo']];function classify(t){if(t.grupo_id)return 'grupo';const periodic=String(t.periodicidade||'').toLowerCase();return periodic&& !['pontual','unica','única','nenhuma','não periódica'].includes(periodic)?'periodicas':'pontuais'}function paint(type,requestedPage=0){pager.hidden=false;page=requestedPage;for(const b of tabs.children){const active=b.dataset.type===type;b.style.background=active?'#185b34':'#d9e8dd';b.style.color=active?'white':'#174b30';b.setAttribute('aria-pressed',String(active))}list.replaceChildren();const filtered=rows.filter(t=>classify(t)===type);const pages=Math.max(1,Math.ceil(filtered.length/pageSize));page=Math.max(0,Math.min(page,pages-1));count.textContent=filtered.length+' tarefa(s) — '+types.find(x=>x[0]===type)[1];for(const t of filtered.slice(page*pageSize,(page+1)*pageSize)){const item=document.createElement('div');item.style.cssText='border-bottom:1px solid #d9e6db;padding:10px 0';const priority=String(t.prioridade||'').toLowerCase(),state=String(t.situacao||'').toLowerCase();const color=/priorit/.test(priority)?'#b00020':/andamento|execu/.test(state)?'#1255a4':/pendente|aguardando|suspens/.test(state)?'#a66c00':/conclu/.test(state)?'#185b34':'#1b1b1b';const title=document.createElement('strong');title.style.color=color;title.textContent=(t.codigo_tarefa||t.id)+' — '+(t.situacao||'Em aberto');const desc=document.createElement('div');desc.style.color=color;const full=String(t.descricao||'');desc.textContent=full.length>70?full.slice(0,70).trimEnd()+'…':full;desc.style.cssText+=';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px';item.style.cursor='pointer';item.onclick=()=>{list.replaceChildren();pager.hidden=true;count.textContent='Detalhes da tarefa';const details=document.createElement('div');details.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere;max-height:42vh;overflow:auto;padding:10px 0';details.textContent=full;const back=document.createElement('button');back.textContent='Voltar à lista';back.onclick=()=>{pager.hidden=false;paint(type,page)};list.append(title.cloneNode(true),details,back)};list.appendChild(item)}pager.replaceChildren();const prev=document.createElement('button');prev.textContent='‹';prev.style.cssText='width:54px;padding:8px';prev.disabled=page===0;prev.onclick=()=>paint(type,page-1);const indicator=document.createElement('strong');indicator.textContent=(page+1)+'/'+pages;const next=document.createElement('button');next.textContent='›';next.style.cssText='width:54px;padding:8px';next.disabled=page>=pages-1;next.onclick=()=>paint(type,page+1);pager.append(prev,indicator,next)}for(const [type,label] of types){const b=document.createElement('button');b.dataset.type=type;b.style.cssText='font-size:11px;padding:7px 2px;min-height:48px;line-height:1.15';b.textContent=label;b.onclick=()=>paint(type);tabs.appendChild(b)}paint('periodicas')}else{const select=document.createElement('select');select.setAttribute('aria-label','Selecionar pessoa');const pessoas=data.pessoas||[];select.append(new Option('Selecione uma pessoa',''),...pessoas.map(p=>new Option(p.nome,p.id)));const detail=document.createElement('div');const render=()=>{detail.replaceChildren();const p=pessoas.find(x=>String(x.id)===select.value);if(!p)return;const weekly=new Set((data.folgas||[]).filter(x=>String(x.pessoa_id)===String(p.id)).map(x=>String(x.dia).slice(0,10)));const holidays=new Set((data.feriados||[]).map(x=>String(x.dia).slice(0,10)));const start=new Date(mes+'-01T12:00:00');const year=start.getFullYear(),month=start.getMonth();const title=document.createElement('h3');title.textContent='Calendário de folgas e feriados — '+start.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});detail.appendChild(title);const legend=document.createElement('p');legend.className='fsjCalendarLegend';legend.textContent='Verde escuro: folga · Dourado: feriado · Verde claro: dia de trabalho · Azul: férias';detail.appendChild(legend);const grid=document.createElement('div');grid.className='fsjCalendarGrid';for(const d of ['D','S','T','Q','Q','S','S']){const h=document.createElement('strong');h.textContent=d;grid.appendChild(h)}const offset=new Date(year,month,1).getDay();for(let i=0;i<offset;i++){grid.appendChild(document.createElement('span'))}for(let day=1;day<=new Date(year,month+1,0).getDate();day++){const iso=mes+'-'+String(day).padStart(2,'0');const vacation=p.ferias_inicio&&p.ferias_fim&&iso>=String(p.ferias_inicio).slice(0,10)&&iso<=String(p.ferias_fim).slice(0,10);const cell=document.createElement('span');cell.textContent=day;cell.className='fsjCalendarDay '+(vacation?'vacation':weekly.has(iso)?'off':holidays.has(iso)?'holiday':'work');cell.title=iso+(vacation?' — Férias':weekly.has(iso)?' — Folga':holidays.has(iso)?' — Feriado':' — Trabalho');grid.appendChild(cell)}detail.appendChild(grid);const note=document.createElement('p');note.className='note';note.textContent='Consulta somente leitura. Os dias de folga e feriados são obtidos dos registros autorizados.';detail.appendChild(note)};select.onchange=render;body.append(select,detail);const holidays=document.createElement('p');holidays.textContent='Feriados: '+(data.feriados||[]).map(h=>h.dia+' — '+h.nome).join('; ');body.appendChild(holidays)}}catch(e){body.textContent='Consulta indisponível: '+e.message}}
document.getElementById('voltar').onclick=()=>{document.getElementById('consulta').hidden=true;document.getElementById('inicioGestor').hidden=false;document.getElementById('name').hidden=false;status.hidden=false;status.textContent='Selecione uma área autorizada.'};
}catch(e){status.textContent='Acesso não liberado: '+e.message}
})();
</script></body></html>
