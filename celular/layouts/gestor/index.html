<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Cache-Control" content="no-store"><title>Assistente FSJ — Celular — Gestor</title><style>body{font:16px system-ui,sans-serif;background:#f3f8f5;color:#173d2b;max-width:480px;margin:3rem auto;padding:1rem}a{color:#155b3c}</style></head>
<body><h1>Fazenda São José</h1><h2>INDEX — Gestor · Celular</h2><p>Layout reservado para o perfil Gestor. As funções operacionais serão vinculadas após validação das permissões do usuário.</p><p><button id="tv" type="button" disabled>TV FSJ — Vídeos e chamadas</button></p><p id="tv-status" role="status"></p><p><a id="entry" href="../../../inicio-usuario.html">Voltar à entrada autenticada</a></p><script>(function(){const u=new URL('../../../inicio-usuario.html',location.href);u.search=location.search;u.hash=location.hash;document.getElementById('entry').href=u.href})();</script><script>
(async function () {
  const token = new URLSearchParams(location.hash.slice(1)).get('token');
  const tv = document.getElementById('tv');
  const status = document.getElementById('tv-status');
  const central = 'https://awrxnzbfrsaurzpunuko.supabase.co/functions/v1/';
  if (!token) return;
  async function request(name, data) {
    const response = await fetch(central + name, {
      method: 'POST', cache: 'no-store',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.erro || 'Acesso à TV indisponível.');
    return result;
  }
  try {
    const person = await request('fsj-index-identidade', { token });
    if (!person.identificacao || !/gestor/i.test(person.perfil || '') || person.proprietario === true) return;
    tv.disabled = false;
    tv.onclick = async () => {
      tv.disabled = true;
      status.textContent = 'Validando acesso à TV FSJ…';
      try {
        const { code } = await request('fsj-tv-espectador-acesso', { action: 'issue', token });
        if (typeof code !== 'string' || !/^[A-Za-z0-9_-]{42,640}$/.test(code)) throw new Error('Acesso à TV indisponível.');
        status.textContent = '';
        location.assign('https://168.196.84.147:9443/espectador#acesso=' + encodeURIComponent(code));
      } catch (error) {
        status.textContent = error.message;
      } finally {
        tv.disabled = false;
      }
    };
  } catch (error) {
    status.textContent = error.message;
  }
})();
</script></body></html>
