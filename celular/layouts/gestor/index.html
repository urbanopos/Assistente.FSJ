<body><header><div class="fsjGestorHeader"><a href="#" id="fsjGestorInicioLogo" aria-label="Voltar à página inicial do Gestor" style="padding:0;background:transparent;border:0"><img src="../../../fsj-logotipo.webp" alt="Fazenda São José — voltar ao início"></a></div></header>
<main><p id="status" role="status">Validando identidade e habilitações...</p><div id="panel" hidden><div class="card"><h2 id="name" hidden>Perfil Gestor</h2><div id="fsjGestorPessoaTopo" hidden></div><div id="inicioGestor"><div id="tvTop"></div><div id="numeroLinks" class="grid" style="margin:9px 0"></div><div id="buttons" class="grid"></div></div><section id="consulta" class="card" hidden><h2 id="consultaTitulo"></h2><div id="consultaConteudo"></div><button type="button" id="voltar" style="margin-top:12px">Voltar</button></section></div></div></main>
<script>
(async function(){
'use strict';
const status=document.getElementById('status'),panel=document.getElementById('panel'),buttons=document.getElementById('buttons');
const token=new URLSearchParams(location.hash.slice(1)).get('token');
document.getElementById('fsjGestorInicioLogo').addEventListener('click',event=>{
 event.preventDefault();
 const consulta=document.getElementById('consulta');
 const topo=document.getElementById('fsjGestorPessoaTopo');
 const inicio=document.getElementById('inicioGestor');
 consulta.hidden=true;
 document.getElementById('consultaConteudo').replaceChildren();
 topo.hidden=true;
 inicio.hidden=false;
 document.getElementById('name').hidden=true;
 status.hidden=false;
 if(!panel.hidden)status.textContent='Selecione uma área autorizada.';
});
if(!token){status.textContent='Link individual não identificado.';return}
async function post(name,data){const response=await fetch('https://awrxnzbfrsaurzpunuko.supabase.co/functions/v1/'+name,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const value=await response.json();if(!response.ok)throw Error(value.erro||'Acesso não autorizado');return value}
try{
const identity=await post('fsj-index-identidade',{token});
if(identity.proprietario===true||!/gestor/i.test(identity.perfil||''))throw Error('Este link não pertence a um Gestor autorizado.');
document.getElementById('name').textContent=identity.nome||identity.identificacao||'Gestor';
const permissions=identity.gestor_permissoes||identity.gestorPermissoes||identity.permissoes_gestor;
if(!permissions||!Array.isArray(permissions.consulta)){status.textContent='Identidade confirmada. As permissões individuais ainda não são fornecidas pelo serviço de acesso. Nenhum botão operacional foi liberado por segurança.';panel.hidden=false;return}
const allowed=permissions.consulta.filter(x=>typeof x==='string');
const technical=/armazenagem|manuten|configura|administra|permiss|seguranca/i;
const modules=[['Início','dashboard'],['Comunicação','comunicacao'],['Disparo Emergencial','disparoEmergencial'],['Folgas e feriados','folgasGestor'],['Minhas tarefas','minhasTarefas'],['Pessoas e Grupos','cadPessoas'],['Registrar tarefa','cadDemanda'],['Relatórios','relatorios'],['Tarefas em Execução','tarefasEmExecucao'],['Vídeos e chamadas — TV FSJ','tv']];
const visible=modules.filter(([label])=>(label==='Tarefas em Execução'||label==='Folgas e feriados')&&allowed.includes(label));
const tvTop=document.getElementById('tvTop');
panel.hidden=false;status.textContent='Perfil validado. '+visible.length+' área(s) operacional(is) autorizada(s).';
if(!visible.length){buttons.textContent='Nenhuma área operacional habilitada.';return}
for(const [label] of visible){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{if(label==='Vídeos e chamadas — TV FSJ'){b.disabled=true;status.textContent='Validando acesso à TV FSJ...';try{const result=await post('fsj-tv-espectador-acesso',{action:'issue',token});if(typeof result.code!=='string'||!/^[A-Za-z0-9_-]{42,640}$/.test(result.code))throw Error('Código de acesso indisponível');location.assign('https://168.196.84.147:9443/espectador#acesso='+encodeURIComponent(result.code));}catch(e){status.textContent='Não foi possível abrir a TV FSJ: '+e.message;b.disabled=false;}return;}if(label==='Folgas e feriados'||label==='Tarefas em Execução'){await abrirConsulta(label);return;}status.textContent='Área '+label+' autorizada; formulário ainda não integrado.'};(label==='Vídeos e chamadas — TV FSJ'?tvTop:buttons).appendChild(b)}

async function abrirConsulta(area){const view=document.getElementById('consulta'),body=document.getElementById('consultaConteudo');document.getElementById('inicioGestor').hidden=true;document.getElementById('name').hidden=true;status.hidden=true;document.getElementById('consultaTitulo').textContent=area;view.hidden=false;body.textContent='Consultando registros autorizados...';status.textContent='Consulta operacional: '+area;try{const mes=window.fsjGestorMes||new Date().toLocaleDateString('en-CA',{timeZone:'America/Recife',year:'numeric',month:'2-digit'}).slice(0,7);const data=await post('fsj-gestor-consulta',{token,area,mes});body.replaceChildren();document.getElementById('fsjGestorPessoaTopo').hidden=true;if(area==='Tarefas em Execução'){const rows=data.registros||[];const tabs=document.createElement('div');tabs.className='fsjGestorFiltros';tabs.style.cssText='display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:10px 0';const count=document.createElement('p'),list=document.createElement('div'),pager=document.createElement('nav');pager.setAttribute('aria-label','Navegação das tarefas');pager.style.cssText='display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0';const personWrap=document.createElement('div');personWrap.style.cssText='margin:10px 0 12px';const personLabel=document.createElement('label');personLabel.textContent='Selecionar funcionário';personLabel.htmlFor='fsjGestorFiltroFuncionario';personLabel.style.cssText='display:block;font-weight:600;margin-bottom:6px';const personSelect=document.createElement('select');personSelect.id='fsjGestorFiltroFuncionario';personSelect.append(new Option('Todos os funcionários',''),...(Array.isArray(data.pessoas)?data.pessoas:[]).map(p=>new Option(p.nome,String(p.id))));personWrap.append(personLabel,personSelect);document.getElementById("fsjGestorPessoaTopo").replaceChildren(personWrap);document.getElementById("fsjGestorPessoaTopo").hidden=false;body.append(tabs,count,list,pager);let page=0;const pageSize=3;const types=[['periodicas','Tarefas Periódicas'],['pontuais','Tarefas Pontuais'],['grupo','Tarefas de Grupo']];function classify(t){if(t.grupo_id)return 'grupo';const periodic=String(t.periodicidade||'').toLowerCase();return periodic&& !['pontual','unica','única','nenhuma','não periódica'].includes(periodic)?'periodicas':'pontuais'}function paint(type,requestedPage=0){document.getElementById('voltar').hidden=false;pager.hidden=false;page=requestedPage;for(const b of tabs.children){const active=b.dataset.type===type;b.style.background=active?'#185b34':'#d9e8dd';b.style.color=active?'white':'#174b30';b.setAttribute('aria-pressed',String(active))}list.replaceChildren();const filtered=rows.filter(t=>classify(t)===type&&(!personSelect.value||(Array.isArray(t.funcionario_ids)&&t.funcionario_ids.map(String).includes(personSelect.value))));const pages=Math.max(1,Math.ceil(filtered.length/pageSize));page=Math.max(0,Math.min(page,pages-1));count.textContent=filtered.length+' tarefa(s) — '+types.find(x=>x[0]===type)[1];for(const t of filtered.slice(page*pageSize,(page+1)*pageSize)){
 const normalize=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
 const priority=normalize(t.prioridade),state=normalize(t.situacao);
 const color=/priorit|urgente/.test(priority)?'#b00020':/conclu|finaliz/.test(state)?'#185b34':/andamento|execu|iniciad/.test(state)?'#1255a4':/pendent|aguard|suspens|entregue/.test(state)?'#a66c00':'#1b1b1b';
 const full=String(t.descricao||'');const rawCode=String(t.codigo_tarefa||t.id);
 const suffix={pontual:'P',diaria:'D',semanal:'S',quinzenal:'Q',mensal:'M',trimestral:'T',semestral:'SM',anual:'A'}[String(t.periodicidade||'').toLowerCase()];
 const code=/^Tar\s*-\s*\d+/i.test(rawCode)?rawCode.replace(/^Tar\s*-\s*(\d+)/i,(_,n)=>'Tar - '+n.padStart(7,'0')):rawCode;
 const displayCode=suffix&&!code.endsWith(' '+suffix)?code+' '+suffix:code;
 const item=document.createElement('button');item.type='button';item.setAttribute('aria-label','Consultar tarefa '+displayCode);
 item.style.cssText='display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid #d9e6db;border-radius:0;padding:10px 0;color:'+color+';cursor:pointer';
 const title=document.createElement('strong');title.style.cssText='display:block;color:inherit;font-size:14px';title.textContent=displayCode+' — '+(t.situacao||'Em aberto');
 const desc=document.createElement('span');desc.textContent=full.length>70?full.slice(0,70).trimEnd()+'…':full;desc.style.cssText='display:block;color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:400';
 item.append(title,desc);
 item.onclick=()=>{
  list.replaceChildren();pager.hidden=true;count.textContent='Detalhes da tarefa';
  const details=document.createElement('div');details.style.cssText='overflow-y:auto;min-height:0;max-height:40dvh;padding:8px 0;color:'+color;
  const heading=document.createElement('strong');heading.textContent=displayCode+' — '+(t.situacao||'Em aberto');heading.style.cssText='display:block;margin-bottom:8px';
  const description=document.createElement('p');description.textContent=full;description.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45;margin:0 0 10px';
  const metadata=document.createElement('p');metadata.style.cssText='font-size:13px;margin:0';metadata.textContent='Prioridade: '+(t.prioridade||'Normal')+' · Periodicidade: '+(t.periodicidade||'Pontual');
  const frequency=String(t.periodicidade||'').toLowerCase();
  const days={semanal:7,quinzenal:14,mensal:30,trimestral:90,semestral:180,anual:365}[frequency];
  details.append(heading,description,metadata);
  if(days&&t.criada_em){
   const local=new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Recife'});
   const created=local.format(new Date(t.criada_em));
   const parse=d=>new Date(d+'T00:00:00Z');
   const iso=d=>d.toISOString().slice(0,10);
   const add=(d,n)=>new Date(parse(d).getTime()+n*86400000).toISOString().slice(0,10);
   const first=add(created,(8-parse(created).getUTCDay())%7||7);
   const today=local.format(new Date());
   let periodIndex=today>=first?Math.floor((parse(today)-parse(first))/(days*86400000)):0;
   const calendar=document.createElement('div');
   const renderPeriod=()=>{
    const start=add(first,periodIndex*days),end=add(start,days-1);
    const fmt=d=>parse(d).toLocaleDateString('pt-BR',{timeZone:'UTC'});
    calendar.replaceChildren();
    const bar=document.createElement('div');bar.style.cssText='display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 8px';
    const prev=document.createElement('button');prev.textContent='‹';prev.style.cssText='width:46px;padding:9px';prev.disabled=periodIndex<=-60;prev.onclick=()=>{periodIndex--;renderPeriod()};
    const label=document.createElement('strong');label.style.cssText='font-size:14px;text-align:center';label.textContent='Período: '+fmt(start)+' a '+fmt(end);
    const next=document.createElement('button');next.textContent='›';next.style.cssText='width:46px;padding:9px';next.onclick=()=>{periodIndex++;renderPeriod()};
    bar.append(prev,label,next);calendar.appendChild(bar);
    const chosen=personSelect.value;
    const valid=(data.execucoes||[]).filter(r=>String(r.tarefa_id)===String(t.id)&&(!chosen||String(r.pessoa_id)===chosen)&&r.dia>=start&&r.dia<=end);
    const beforeStart=periodIndex<0,completed=!beforeStart&&valid.length>0,expired=!beforeStart&&end<today;
    const executions=new Set(valid.map(r=>r.dia));
    const grid=document.createElement('div');grid.style.cssText='display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px';
    for(const name of ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom']){const head=document.createElement('span');head.textContent=name;head.style.cssText='font-size:11px;text-align:center';grid.appendChild(head)}
    const firstOffset=(parse(start).getUTCDay()+6)%7;
    for(let i=0;i<firstOffset;i++)grid.appendChild(document.createElement('span'));
    for(let i=0;i<days;i++){
     const date=add(start,i),executed=!beforeStart&&executions.has(date);
     const cell=document.createElement('span');cell.textContent=String(parse(date).getUTCDate());cell.title=fmt(date)+(executed?' — Executada':completed?' — Período cumprido':expired?' — Não cumprida':' — Aguardando');
     cell.style.cssText='display:flex;align-items:center;justify-content:center;min-height:36px;border-radius:7px;font-weight:700;font-size:13px;background:'+(beforeStart?'#e2e2e2':executed?'#17663d':completed?'#dbeafe':expired?'#b91c1c':'#bde7c9')+';color:'+(beforeStart?'#666':executed||expired?'white':completed?'#185aa0':'#174b30');
     grid.appendChild(cell);
    }
    calendar.appendChild(grid);
    const note=document.createElement('p');note.style.cssText='font-size:12px;margin:9px 0';note.textContent=beforeStart?'Antes do início da tarefa: sem obrigação de execução.':completed?'Período cumprido. Verde: execução; azul: demais dias bloqueados.':expired?'Período vencido sem execução registrada.':'Período em andamento, aguardando execução.';
    calendar.appendChild(note);
   };
   renderPeriod();details.appendChild(calendar);
  }
  const back=document.createElement('button');back.type='button';back.textContent='Voltar à lista';back.style.cssText='margin-top:8px';back.onclick=()=>paint(type,page);
  list.append(details,back);document.getElementById('voltar').hidden=true;
 };
 list.appendChild(item)
}pager.replaceChildren();const prev=document.createElement('button');prev.textContent='‹';prev.style.cssText='width:54px;padding:8px';prev.disabled=page===0;prev.onclick=()=>paint(type,page-1);const indicator=document.createElement('strong');indicator.textContent=(page+1)+'/'+pages;const next=document.createElement('button');next.textContent='›';next.style.cssText='width:54px;padding:8px';next.disabled=page>=pages-1;next.onclick=()=>paint(type,page+1);pager.append(prev,indicator,next)}for(const [type,label] of types){const b=document.createElement('button');b.dataset.type=type;b.style.cssText='font-size:11px;padding:7px 2px;min-height:48px;line-height:1.15';b.textContent=label;b.onclick=()=>paint(type);tabs.appendChild(b)}personSelect.onchange=()=>paint([...tabs.children].find(b=>b.getAttribute('aria-pressed')==='true')?.dataset.type||'periodicas',0);paint('periodicas')}else{const select=document.createElement('select');select.setAttribute('aria-label','Selecionar pessoa');const pessoas=data.pessoas||[];select.append(new Option('Selecione uma pessoa',''),...pessoas.map(p=>new Option(p.nome,p.id)));if(window.fsjGestorPessoa&&pessoas.some(p=>String(p.id)===String(window.fsjGestorPessoa)))select.value=window.fsjGestorPessoa;else if(pessoas.length)select.value=String(pessoas[0].id);const detail=document.createElement('div');const mudarMes=async delta=>{const [y,m]=mes.split('-').map(Number);const d=new Date(y,m-1+delta,1);window.fsjGestorMes=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');await abrirConsulta(area);};const render=()=>{detail.replaceChildren();const p=pessoas.find(x=>String(x.id)===select.value);if(!p)return;const weekly=new Set([...(Array.isArray(p.folgas_datas)?p.folgas_datas:[]),...(data.folgas||[]).filter(x=>String(x.pessoa_id)===String(p.id)).map(x=>x.dia)].map(x=>String(x).slice(0,10)));const holidays=new Set((data.feriados||[]).map(x=>String(x.dia).slice(0,10)));const start=new Date(mes+'-01T12:00:00');const year=start.getFullYear(),month=start.getMonth();const nav=document.createElement('div');nav.style.cssText='display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0';const prev=document.createElement('button');prev.textContent='‹';prev.setAttribute('aria-label','Mês anterior');prev.style.width='54px';const next=document.createElement('button');next.textContent='›';next.setAttribute('aria-label','Próximo mês');next.style.width='54px';const title=document.createElement('strong');title.textContent=start.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});prev.onclick=()=>mudarMes(-1);next.onclick=()=>mudarMes(1);nav.append(prev,title,next);detail.appendChild(nav);const legend=document.createElement('p');legend.className='fsjCalendarLegend';legend.textContent='Verde escuro: folga · Dourado: feriado · Verde claro: dia de trabalho · Azul: férias';detail.appendChild(legend);const grid=document.createElement('div');grid.className='fsjCalendarGrid';for(const d of ['D','S','T','Q','Q','S','S']){const h=document.createElement('strong');h.textContent=d;grid.appendChild(h)}const offset=new Date(year,month,1).getDay();for(let i=0;i<offset;i++){grid.appendChild(document.createElement('span'))}for(let day=1;day<=new Date(year,month+1,0).getDate();day++){const iso=mes+'-'+String(day).padStart(2,'0');const vacation=p.ferias_inicio&&p.ferias_fim&&iso>=String(p.ferias_inicio).slice(0,10)&&iso<=String(p.ferias_fim).slice(0,10);const cell=document.createElement('span');cell.textContent=day;cell.className='fsjCalendarDay '+(vacation?'vacation':weekly.has(iso)?'off':holidays.has(iso)?'holiday':'work');cell.title=iso+(vacation?' — Férias':weekly.has(iso)?' — Folga':holidays.has(iso)?' — Feriado':' — Trabalho');grid.appendChild(cell)}detail.appendChild(grid);const note=document.createElement('p');note.className='note';note.textContent='Consulta somente leitura. Os dias de folga e feriados são obtidos dos registros autorizados.';detail.appendChild(note)};select.onchange=()=>{window.fsjGestorPessoa=select.value;render()};body.append(select,detail);render();const holidays=document.createElement('p');holidays.textContent='Feriados: '+(data.feriados||[]).map(h=>h.dia+' — '+h.nome).join('; ');body.appendChild(holidays)}}catch(e){body.textContent='Consulta indisponível: '+e.message}}
document.getElementById('voltar').onclick=()=>{document.getElementById('consulta').hidden=true;document.getElementById('fsjGestorPessoaTopo').hidden=true;document.getElementById('inicioGestor').hidden=false;document.getElementById('name').hidden=true;status.hidden=false;status.textContent='Selecione uma área autorizada.'};
}catch(e){status.textContent='Acesso não liberado: '+e.message}
})();
</script></body></html>
