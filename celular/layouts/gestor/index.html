<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Cache-Control" content="no-store"><title>Assistente FSJ — Gestor · Celular</title>
<style>body{font:16px system-ui,sans-serif;margin:0;background:#f0f5f1;color:#193e2a}header{background:#e4f1e6;text-align:center;padding:18px 12px;border-bottom:2px solid #276341}main{max-width:520px;margin:auto;padding:16px}h1{font-size:21px;margin:0}h2{font-size:18px}button,a.link{box-sizing:border-box;border:0;border-radius:9px;background:#246a3b;color:white;padding:13px;font:600 15px system-ui,sans-serif;text-align:center;display:block;width:100%;text-decoration:none}button:disabled{opacity:.5}select{width:100%;padding:11px;border-radius:8px;border:1px solid #a6bba9}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid button{min-height:60px}.note{font-size:13px;color:#526858}.card{background:white;border-radius:13px;padding:14px;margin:14px 0;box-shadow:0 1px 5px #0001}#status{padding:12px;background:#fff6df;border-radius:8px}</style></head>
<body><header><h1>Fazenda São José</h1><div>Assistente FSJ · Gestor</div></header>
<main><p id="status" role="status">Validando identidade e habilitações...</p><div id="panel" hidden><div class="card"><h2 id="name">Perfil Gestor</h2><p class="note">Acesso operacional conforme autorização do Proprietário. Administração técnica indisponível.</p><div id="buttons" class="grid"></div></div></div><p class="note">O acesso é individual e não depende do horário. Nenhuma função é liberada sem validação das permissões.</p></main>
<script>
(async function(){
'use strict';
const status=document.getElementById('status'),panel=document.getElementById('panel'),buttons=document.getElementById('buttons');
const token=new URLSearchParams(location.hash.slice(1)).get('token');
if(!token){status.textContent='Link individual não identificado.';return}
async function post(name,data){const response=await fetch('https://awrxnzbfrsaurzpunuko.supabase.co/functions/v1/'+name,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const value=await response.json();if(!response.ok)throw Error(value.erro||'Acesso não autorizado');return value}
try{
const identity=await post('fsj-index-identidade',{token});
if(identity.proprietario===true||!/gestor/i.test(identity.perfil||''))throw Error('Este link não pertence a um Gestor autorizado.');
document.getElementById('name').textContent=identity.nome||identity.identificacao||'Gestor';
const permissions=identity.gestor_permissoes||identity.gestorPermissoes||identity.permissoes_gestor;
if(!permissions||!Array.isArray(permissions.consulta)){status.textContent='Identidade confirmada. As permissões individuais ainda não são fornecidas pelo serviço de acesso. Nenhum botão operacional foi liberado por segurança.';panel.hidden=false;return}
const allowed=permissions.consulta.filter(x=>typeof x==='string');
const technical=/armazenagem|manuten|configura|administra|permiss|seguranca/i;
const modules=[['Início','dashboard'],['Comunicação','comunicacao'],['Disparo Emergencial','disparoEmergencial'],['Folgas e feriados','folgasGestor'],['Minhas tarefas','minhasTarefas'],['Pessoas e Grupos','cadPessoas'],['Registrar tarefa','cadDemanda'],['Relatórios','relatorios'],['Tarefas em Execução','tarefasEmExecucao'],['Vídeos e chamadas — TV FSJ','tv']];
const visible=modules.filter(([label])=>allowed.includes(label)&&!technical.test(label));
panel.hidden=false;status.textContent='Perfil validado. '+visible.length+' área(s) operacional(is) autorizada(s).';
if(!visible.length){buttons.textContent='Nenhuma área operacional habilitada.';return}
for(const [label] of visible){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{status.textContent='Área '+label+' autorizada no cadastro. A navegação operacional será disponibilizada após validação da autorização no servidor; nenhum acesso administrativo será concedido.'};buttons.appendChild(b)}
}catch(e){status.textContent='Acesso não liberado: '+e.message}
})();
</script></body></html>
