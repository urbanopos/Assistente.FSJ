<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Cache-Control" content="no-store"><title>FSJ — Execução e Supervisão V001</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf7f3;color:#173b2a;font:16px system-ui,sans-serif}.app{max-width:520px;margin:auto;min-height:100dvh;background:#f8fcfa;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:12px;padding:12px;background:#e6f5ee;border-bottom:1px solid #bad5c6}header img{width:49px;height:49px;object-fit:contain}header strong{font-size:21px}header small{display:block}.user-photo{margin-left:auto;width:48px;height:48px;flex:none;border:2px solid #a7cdb8;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;color:#456b58}.user-photo img{width:100%;height:100%;object-fit:cover}.exit{border:0;border-radius:8px;background:#465b51;color:white;padding:10px 18px;font-weight:700;cursor:pointer}main{padding:15px;flex:1}h1{font-size:19px;text-align:center;background:#086334;color:#fff;border-radius:12px;padding:13px 8px;margin:0 0 14px}h1 small{display:block;font-size:12px;font-weight:400;margin-top:4px}.status{font-size:13px;min-height:28px;color:#555}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:12px 0 19px}.stats a{background:#fff;border:1px solid #b6d4c5;border-radius:10px;padding:9px 3px;text-align:center;color:#123c26;text-decoration:none;font-size:11px}.stats b{display:block;color:#1647b9;font-size:23px;margin-top:6px}.menu{display:grid;gap:10px}.btn{display:block;border:0;border-radius:10px;background:#006a38;color:#fff;text-align:center;font:600 18px system-ui;padding:17px 8px;text-decoration:none;cursor:pointer;width:100%}.btn.blue{background:#1251a8}.btn:disabled{opacity:.5}.hidden{display:none!important}footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #c2dacc;padding:12px 20px;background:#e8f5ed}footer button{border:0;background:transparent;font-size:22px}#message{color:#9b2a20;font-size:13px}
</style></head><body><div class="app"><header><img src="../../../icon-512.png" alt="FSJ"><div><strong>Fazenda São José</strong><small id="person">Validando acesso individual...</small></div><div class="user-photo" id="userPhoto" aria-label="Foto do usuário"><span aria-hidden="true">👤</span></div></header><main><h1><span id="fsjIndexTitulo">INDEX – Execução</span><small>V001 | 06/11/2026 | Celular</small></h1><p class="status" id="status">Identificando perfil e vínculos...</p><nav class="menu" aria-label="Ações autorizadas"><a class="btn" id="tv" href="#" rel="noreferrer" aria-disabled="true">TV FSJ — Vídeos e chamadas</a><a class="btn" id="tasks" href="#">Minhas Tarefas</a><a class="btn" id="leave" href="#">Folgas e Férias</a><a class="btn" id="suggest" href="#">Sugestão de Tarefas</a><a class="btn blue hidden" id="supervision" href="#">Supervisão</a></nav><p id="message" role="alert"></p></main><footer><span aria-hidden="true"></span><span>1 / 1</span><button type="button" aria-label="Próxima página" disabled>→</button></footer></div>
<script>
(()=>{'use strict';const root="../../../",expected="supervisor",params=new URLSearchParams(location.hash.slice(1)),token=params.get('token')||new URLSearchParams(location.search).get('token')||'',valid=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;const el=id=>document.getElementById(id),link=(path,extra='')=>root+path+'#token='+encodeURIComponent(token)+extra;const ids=['tv','tasks','leave','suggest','supervision'];
const protectedIds=['tasks','leave','suggest','supervision'];
function horarioFSJ(){const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'America/Recife',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const hh=Number(parts.find(x=>x.type==='hour')?.value),mm=Number(parts.find(x=>x.type==='minute')?.value);if(!Number.isFinite(hh)||!Number.isFinite(mm))return false;const t=hh*60+mm;return t>=420&&t<720||t>=840&&t<980}
function atualizarDescanso(){const ok=horarioFSJ();for(const id of protectedIds){const a=el(id);if(!a)continue;a.setAttribute('aria-disabled',String(!ok));a.style.opacity=ok?'':'0.55';a.classList.toggle('hidden',!ok);a.tabIndex=ok?0:-1;a.dataset.fsjHorario=ok?'liberado':'descanso'}let notice=el('fsjAvisoDescanso');if(!notice){notice=document.createElement('p');notice.id='fsjAvisoDescanso';notice.setAttribute('role','status');notice.style.cssText='padding:12px;background:#fff3d8;border:1px solid #d5b575;border-radius:9px;text-align:center;font-weight:600';el('tv').after(notice)}notice.hidden=ok;notice.textContent=ok?'':'Horário de descanso. Tarefas disponíveis das 7h às 12h e das 14h às 16h20. TV FSJ permanece disponível.';return ok}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)atualizarDescanso()});setInterval(atualizarDescanso,30000);atualizarDescanso();
ids.forEach(id=>el(id).addEventListener('click',e=>{if(id==='tv'&&!el(id).dataset.ready){e.preventDefault();el('message').textContent='Abra a TV pelo seu acesso individual validado.';return}if(protectedIds.includes(id)&&!atualizarDescanso()){e.preventDefault();e.stopImmediatePropagation();el('message').textContent='Acesso às tarefas bloqueado durante o descanso.';return;}if(id==='supervision'&&!el(id).dataset.ready){e.preventDefault();el('message').textContent='Supervisão não autorizada.'}}));const urls={tasks:root+'quadro.html?fsj_index=supervisor#token='+encodeURIComponent(token)+'&origem=inicio',leave:'./folgas-v2.html#token='+encodeURIComponent(token),suggest:link('quadro.html','&origem=inicio&secao=sugestoes')};for(const [id,url]of Object.entries(urls)){el(id).href=url;el(id).dataset.ready='1'};if(!valid.test(token)){el('status').textContent='Acesso individual necessário';el('message').textContent='Abra pelo seu link individual do WhatsApp.';return;}
async function api(fn,data){const r=await fetch('https://awrxnzbfrsaurzpunuko.supabase.co/functions/v1/'+fn,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.erro||'Falha ao validar acesso');return j}
async function load(){try{const identity=await api('fsj-index-identidade',{token});const name=String(identity.identificacao||'').trim();if(!name)throw Error('Usuário não identificado');const role=String(identity.perfil||'').trim().toLowerCase();const isSupervisor=/supervisor|supervisora/.test(role);const isExecutor=/executor|funcion[aá]ri|participante/.test(role);const canSupervise=identity.supervisao===true;el('fsjIndexTitulo').textContent=canSupervise?'INDEX – Execução e Supervisão':'INDEX – Execução';if(!canSupervise)throw Error('Este INDEX exige autorização ativa de supervisão no cadastro');el('tv').href='https://168.196.84.147/espectador';el('tv').dataset.ready='1';el('tv').removeAttribute('aria-disabled');el('person').textContent=name+' · '+(isSupervisor?'Supervisor':canSupervise?'Executor com supervisão':'Executor');el('status').textContent=horarioFSJ()?'Registros vinculados ao seu acesso':'Horário de descanso — acesso operacional suspenso';atualizarDescanso();
if(canSupervise){el('supervision').classList.remove('hidden');el('supervision').href=link('supervisor.html');el('supervision').dataset.ready='1';atualizarDescanso()}
}catch(err){el('status').textContent='Acesso indisponível';el('message').textContent=err.message}}load();
})();
</script><script src="../../../compartilhado/cabecalho-navegacao.js?v=20261106-sair-sem-duplicacao-03"></script></body></html>
