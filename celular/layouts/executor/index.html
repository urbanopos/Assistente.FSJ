<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Cache-Control" content="no-store"><title>FSJ — Execução e Supervisão V001</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf7f3;color:#173b2a;font:16px system-ui,sans-serif}.app{max-width:520px;margin:auto;min-height:100dvh;background:#f8fcfa;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:12px;padding:12px;background:#e6f5ee;border-bottom:1px solid #bad5c6}header img{width:49px;height:49px;object-fit:contain}header strong{font-size:21px}header small{display:block}main{padding:15px;flex:1}h1{font-size:19px;text-align:center;background:#086334;color:#fff;border-radius:12px;padding:13px 8px;margin:0 0 14px}h1 small{display:block;font-size:12px;font-weight:400;margin-top:4px}.status{font-size:13px;min-height:28px;color:#555}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:12px 0 19px}.stats a{background:#fff;border:1px solid #b6d4c5;border-radius:10px;padding:9px 3px;text-align:center;color:#123c26;text-decoration:none;font-size:11px}.stats b{display:block;color:#1647b9;font-size:23px;margin-top:6px}.menu{display:grid;gap:10px}.btn{display:block;border:0;border-radius:10px;background:#006a38;color:#fff;text-align:center;font:600 18px system-ui;padding:17px 8px;text-decoration:none;cursor:pointer;width:100%}.btn.blue{background:#1251a8}.btn:disabled{opacity:.5}.hidden{display:none!important}footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #c2dacc;padding:12px 20px;background:#e8f5ed}footer button{border:0;background:transparent;font-size:22px}#message{color:#9b2a20;font-size:13px}
</style></head><body><div class="app"><header><img src="../../../icon-512.png" alt="FSJ"><div><strong>Fazenda São José</strong><small id="person">Validando acesso individual...</small></div></header><main><h1>INDEX – Execução e Supervisão<small>V001 | 06/11/2026 | Celular</small></h1><p class="status" id="status">Identificando perfil e vínculos...</p><section class="stats"><a id="open" href="#"><span>Em aberto</span><b>—</b></a><a id="done" href="#"><span>Concluídas</span><b>—</b></a><a id="pending" href="#"><span>Pendentes</span><b>—</b></a><a id="questions" href="#"><span>Perguntas</span><b>—</b></a></section><nav class="menu" aria-label="Ações autorizadas"><a class="btn" id="tv" href="#">TV FSJ — Vídeos e chamadas</a><a class="btn" id="tasks" href="#">Minhas Tarefas</a><a class="btn" id="leave" href="#">Folgas e Férias</a><a class="btn" id="suggest" href="#">Sugestão de Tarefas</a><a class="btn blue hidden" id="supervision" href="#">Supervisão</a></nav><p id="message" role="alert"></p></main><footer><button type="button" aria-label="Página anterior" disabled>←</button><span>1 / 1</span><button type="button" aria-label="Próxima página" disabled>→</button></footer></div>
<script>
(()=>{'use strict';const root="../../../",expected="executor",params=new URLSearchParams(location.hash.slice(1)),token=params.get('token')||new URLSearchParams(location.search).get('token')||'',valid=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;const el=id=>document.getElementById(id),link=(path,extra='')=>root+path+'#token='+encodeURIComponent(token)+extra;const ids=['tv','tasks','leave','suggest','supervision','open','done','pending','questions'];ids.forEach(id=>el(id).addEventListener('click',e=>{if(!el(id).dataset.ready){e.preventDefault();el('message').textContent='Acesso não validado.'}}));if(!valid.test(token)){el('status').textContent='Acesso individual necessário';el('message').textContent='Abra pelo seu link individual do WhatsApp.';return;}
async function api(fn,data){const r=await fetch('https://awrxnzbfrsaurzpunuko.supabase.co/functions/v1/'+fn,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.erro||'Falha ao validar acesso');return j}
async function load(){try{const d=await api('resposta-tarefa',{action:'board',token});if(d.visitante||d.simulador)throw Error('Acesso não autorizado neste INDEX');const name=String(d.responsavel||'').trim();if(!name)throw Error('Usuário não identificado');const role=String(d.perfil||d.categoria||d.tipo_perfil||'').trim().toLowerCase();const isSupervisor=/supervisor|supervisora/.test(role);const isExecutor=/executor|funcion[aá]ri|participante/.test(role);if(!isExecutor&&!isSupervisor)throw Error('Este INDEX é exclusivo para execução e supervisão');if(expected==='supervisor'&&!isSupervisor)throw Error('O perfil não possui autorização de supervisor');el('person').textContent=name+' · '+(isSupervisor?'Supervisor':'Executor');el('status').textContent='Registros vinculados ao seu acesso';const tasks=Array.isArray(d.tarefas)?d.tarefas:[];const st=t=>String(t.situacao||t.status||'').toLowerCase();el('open').querySelector('b').textContent=tasks.filter(t=>/abert/.test(st(t))).length;el('done').querySelector('b').textContent=tasks.filter(t=>/conclu/.test(st(t))).length;el('pending').querySelector('b').textContent=tasks.filter(t=>/pendent|aguard/.test(st(t))).length;el('questions').querySelector('b').textContent='—';const urls={tv:link('quadro.html','&secao=videos'),tasks:link('quadro.html'),leave:link('inicio-usuario.html'),suggest:link('quadro.html','&secao=sugestoes'),open:link('quadro.html','&filtro=aberto'),done:link('quadro.html','&filtro=concluido'),pending:link('quadro.html','&filtro=pendente'),questions:link('quadro.html','&filtro=perguntas')};for(const [id,url]of Object.entries(urls)){el(id).href=url;el(id).dataset.ready='1'}
if(isSupervisor){const check=await api('supervisao',{action:'available',token}).catch(()=>null);if(check&&check.ativo===true){el('supervision').classList.remove('hidden');el('supervision').href=link('supervisor.html');el('supervision').dataset.ready='1'}
}catch(err){el('status').textContent='Acesso indisponível';el('message').textContent=err.message}}load();
})();
</script></body></html>
