<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>FSJ — Folgas e Férias</title><style>*{box-sizing:border-box}body{margin:0;background:#edf7f3;color:#173b2a;font:16px system-ui}.app{max-width:520px;margin:auto;min-height:100dvh;background:#f8fcfa;padding:15px}header{display:flex;align-items:center;gap:12px}header img{width:46px}h1{font-size:22px;text-align:center;background:#086334;color:white;padding:14px;border-radius:10px}nav{display:flex;justify-content:space-between;align-items:center;margin:20px 0}button{cursor:pointer;border:1px solid #a5c7b4;background:#fff;border-radius:8px;padding:12px;font-size:16px}#month{text-transform:capitalize;text-align:center}#grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.day{border:1px solid #d5e2d9;border-radius:6px;text-align:center;padding:10px 2px;min-height:41px}.marked{background:#bde7c9;color:#11492a;font-weight:bold}.vacation{background:#c9dcfa;color:#173f81}.holiday{background:#f9e3a9;color:#684800}.back{display:block;margin-top:18px;text-align:center;background:#006a38;color:white;padding:14px;border-radius:9px;text-decoration:none}#status{font-size:14px}#entries{font-size:14px}small{display:block}</style></head><body><div class="app"><header><img src="../../../icon-512.png" alt="FSJ"><strong>Fazenda São José</strong></header><h1>Folgas e Férias<small>Consulta individual — somente leitura</small></h1><p id="status">Consultando calendário...</p><nav><button id="prev" type="button" aria-label="Mês anterior">←</button><strong id="month"></strong><button id="next" type="button" aria-label="Próximo mês">→</button></nav><div id="grid"></div><div id="entries"></div><button id="refresh" type="button">Atualizar registros</button><a class="back" id="back" href="#">Voltar ao Index</a></div><script>
(()=>{'use strict';const token=new URLSearchParams(location.hash.slice(1)).get('token')||new URLSearchParams(location.search).get('token')||'';const el=id=>document.getElementById(id);const month=new Date();month.setDate(1);let records=null;el('back').href='./index.html#token='+encodeURIComponent(token);
function render(){const y=month.getFullYear(),m=month.getMonth();el('month').textContent=month.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});const grid=el('grid');grid.replaceChildren();const entries=el('entries');entries.replaceChildren();for(const label of ['D','S','T','Q','Q','S','S']){const d=document.createElement('strong');d.textContent=label;d.style.textAlign='center';grid.append(d)}for(let i=0;i<new Date(y,m,1).getDay();i++)grid.append(document.createElement('span'));const found=[];for(let d=1;d<=new Date(y,m+1,0).getDate();d++){const date=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');const marked=records&&Array.isArray(records.folgas_datas)&&records.folgas_datas.includes(date);const kind=marked?String(records.folgas_motivos?.[date]||'Folga Semanal'):'';const cell=document.createElement('div');cell.className='day'+(marked?' marked':'')+(/férias|ferias/i.test(kind)?' vacation':/feriado/i.test(kind)?' holiday':'');cell.textContent=d;cell.title=kind||'Sem marcação';grid.append(cell);if(marked)found.push(date.slice(8)+'/'+date.slice(5,7)+' — '+kind)}if(records){const p=document.createElement('p');p.textContent=found.length?'Marcações do mês:':'Nenhuma folga ou férias registrada neste mês.';entries.append(p);for(const item of found){const line=document.createElement('p');line.textContent=item;entries.append(line)}}}
async function load(){el('status').textContent='Consultando registros do seu perfil...';if(!token){el('status').textContent='Abra o calendário pelo link individual do WhatsApp.';return}try{const r=await fetch('https://awrxnzbfrsaurzpunuko.supabase.co/functions/v1/resposta-tarefa',{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'folgas-consulta',token})});const data=await r.json();if(!r.ok)throw Error(data.erro||'Consulta indisponível');if(!Array.isArray(data.folgas_datas)||!data.folgas_motivos)throw Error('Dados de calendário incompletos');records=data;el('status').textContent='Calendário de '+(data.pessoa||'seu perfil')+' — somente leitura';render()}catch(e){el('status').textContent='Não foi possível carregar as marcações: '+e.message;render()}}
el('prev').onclick=()=>{month.setMonth(month.getMonth()-1);render()};el('next').onclick=()=>{month.setMonth(month.getMonth()+1);render()};el('refresh').onclick=load;render();load()})();
</script></body></html>
