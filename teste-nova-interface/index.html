<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>FSJ | Nova Interface — TESTES</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;color:#163b36;background:#dce8e8}button,select{font:inherit}button{cursor:pointer}#app{height:100dvh;max-width:480px;margin:auto;display:flex;flex-direction:column;background:#f4faf9;overflow:hidden;box-shadow:0 0 20px #abc}.top{background:#e2f6fc;border-top:5px solid #176145;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0}.brand{font-weight:bold;font-size:15px}.sub{font-size:10px;color:#826d22}.owner{font-size:11px;text-align:right}.nav{display:flex;gap:8px;align-items:center;padding:7px 10px;background:#eaf5f8;flex-shrink:0}.home{background:white;border:1px solid #cbdad9;border-radius:8px;font-size:23px;width:46px;height:43px}.navbox{flex:1;min-width:0}.navlabel{font-size:10px;color:#456}.nav select{width:100%;height:32px;border:1px solid #c9d8d8;border-radius:7px;background:white}.content{flex:1;min-height:0;overflow:hidden;padding:9px 12px;display:flex;flex-direction:column;gap:8px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;flex-shrink:0}.kpi{background:white;border:1px solid #dce8e7;border-radius:9px;padding:7px 2px;text-align:center;min-width:0}.kpi small{font-size:10px;display:block}.kpi b{display:block;color:#1540b3;font-size:24px;margin-top:4px;text-decoration:underline}.calendar{background:white;border:1px solid #dce8e7;border-radius:9px;padding:8px;min-height:0;flex:1;display:flex;flex-direction:column;gap:4px}.calhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:bold}.calhead button{border:0;background:#eef4f4;border-radius:5px;padding:4px 8px}.days{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,minmax(0,1fr));gap:2px;flex:1;min-height:0}.day{border:0;border-radius:4px;background:#f0f5f5;font-size:11px;min-height:0;padding:1px}.day.holiday{background:#ffda58;font-weight:bold}.day.selected{background:#176145;color:white}.week{font-size:9px;text-align:center;color:#4b6560}.green{border:0;border-radius:8px;background:#176145;color:white;font-weight:bold;padding:10px 7px;min-height:36px;font-size:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex-shrink:0}.full{grid-column:1/-1}.executor{display:flex;gap:6px;flex-shrink:0}.executor select{min-width:0;flex:1;border:1px solid #cbdad9;border-radius:7px;padding:6px;background:white}.executor button{flex:0 0 auto}.footer{flex-shrink:0;background:#eaf5f8;padding:8px 15px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #cbdad9}.footer button{border:1px solid #cbdad9;background:white;border-radius:7px;padding:6px 14px;font-size:19px}.footer button:disabled{opacity:.35}.pane{background:white;border:1px solid #dce8e7;border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}.pane h2{font-size:18px;margin:0}.pane p{font-size:13px;margin:0}.pane select{padding:9px;border:1px solid #cbdad9;border-radius:7px}.task{padding:12px;border-radius:8px;background:#f0f5f5;font-size:13px}.muted{color:#60716e;font-size:12px}.testmark{font-size:10px;color:#9b4b11;font-weight:bold}.spacer{flex:1}@media(max-height:700px){.top{padding:5px 9px}.content{gap:5px;padding:6px 9px}.kpi{padding:4px 2px}.kpi b{font-size:20px}.calendar{padding:5px}.green{min-height:30px;padding:7px 5px}.footer{padding:4px 12px}.actions{gap:4px}.executor select{padding:3px}}
</style></head><body><div id="app"><header class="top"><div><div class="brand">🌿 FAZENDA SÃO JOSÉ</div><div class="sub">ASSISTENTE FSJ — TESTE ISOLADO</div></div><div class="owner">Proprietário: Urbano<br>Armazenagem central<br><span class="testmark">SEM CONEXÃO À PRODUÇÃO</span></div></header><nav class="nav"><button class="home" id="home" title="Página inicial">⌂</button><div class="navbox"><div class="navlabel" id="navlabel">Menu Principal — Início</div><select id="menu" aria-label="Menu Principal"></select></div></nav><main class="content" id="content"></main><footer class="footer"><button id="prev" aria-label="Anterior">←</button><span id="counter">1 / 1</span><button id="next" aria-label="Próximo">→</button></footer></div><script>
"use strict";const sections={inicio:["Painel principal"],duvidas:["Dúvidas recebidas","Sugestões recebidas"],tv:["Biblioteca de vídeos","Vídeo institucional","Chamadas"],registro:["Dados da tarefa","Executores e grupos","Prazos e confirmação"],emergencia:["Destinatários","Mensagem","Revisão"],pessoas:["Pessoas cadastradas","Cadastro de pessoa","Grupos cadastrados"],folgas:["Calendário","Folgas semanais","Feriados"],execucao:["Resumo do executor","Tarefas do executor","Detalhes da tarefa"]},names={inicio:"Início",duvidas:"Dúvidas e sugestões",tv:"TV FSJ",registro:"Registro de Tarefas",emergencia:"Disparo de Emergência",pessoas:"Pessoas e Grupos",folgas:"Folgas e feriados",execucao:"Acompanhamento"};let section="inicio",page=0,executor="",month=9,year=2026,selectedDay=27,filter="Todas";const $=id=>document.getElementById(id),escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const demo=[{id:"Tar-000001",executor:"Menininha",title:"Inspecionar as tarefas do Campo e do Aviário",status:"Em aberto"},{id:"Tar-000002",executor:"Carlos",title:"Verificar os serviços programados",status:"Em andamento"},{id:"Tar-000003",executor:"Antônio",title:"Conferir as atividades concluídas",status:"Concluída"}];const opts=['Menininha','Carlos','Antônio','Urbano'];function change(s){section=s;page=0;render()}function changeMonth(n){let d=new Date(year,month+n,1);year=d.getFullYear();month=d.getMonth();render()}function calendar(){let first=new Date(year,month,1).getDay(),total=new Date(year,month+1,0).getDate(),label=new Date(year,month,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"});let h='<div class="calendar"><div class="calhead"><button data-month="-1">‹</button>'+escapeHtml(label) +'<button data-month="1">›</button></div><div class="days">';for(let i=0;i<7;i++)h+='<span class="week">'+['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][i]+'</span>';for(let i=0;i<42;i++){let d=i-first+1;let holiday=(month===9&&d===12)||(month===10&&(d===2||d===15))||(month===11&&d===25)||(month===0&&d===1)||(month===8&&d===7);h+=d>0&&d<=total?'<button class="day '+(holiday?'holiday ':'')+(selectedDay===d?'selected':'')+'" data-day="'+d+'">'+d+'</button>':'<span></span>'}return h+'</div></div>'}function render(){let content=$('content'),list=sections[section];$('navlabel').textContent='Menu Principal — '+names[section];$('menu').innerHTML=list.map((s,i)=>'<option value="'+i+'">'+escapeHtml(s)+'</option>').join('');$('menu').value=String(page);$('counter').textContent=(page+1)+' / '+list.length;$('prev').disabled=page===0;$('next').disabled=page===list.length-1;if(section==='inicio'){content.innerHTML='<div class="kpis">'+[['Em aberto','58','execucao'],['Concluídas','22','execucao'],['Pendentes','0','execucao'],['Perguntas','1','duvidas']].map(x=>'<button class="kpi" data-go="'+x[2]+'"><small>'+x[0]+'</small><b>'+x[1]+'</b></button>').join('')+'</div>'+calendar()+'<div class="actions"><button class="green full" data-go="duvidas">Responder dúvidas e sugestões</button><button class="green full" data-go="tv">TV FSJ — Vídeos e chamadas</button><button class="green" data-go="registro">Registro de Tarefas</button><button class="green" data-go="emergencia">Disparo de Emergência</button><button class="green" data-go="pessoas">Pessoas e Grupos</button><button class="green" data-go="folgas">Folgas e feriados</button></div><div class="executor"><select id="executor"><option value="">Nome do Executor — selecione</option>'+opts.map(x=>'<option '+(x===executor?'selected':'')+'>'+x+'</option>').join('')+'</select><button class="green" id="acomp">Acompanhar</button></div>'}else{let title=list[page],task=demo.find(t=>t.executor===executor);let extra=section==='execucao'?'<p>Executor: <strong>'+escapeHtml(executor||'Não selecionado')+'</strong></p><select id="executor"><option value="">Selecione o executor</option>'+opts.map(x=>'<option '+(x===executor?'selected':'')+'>'+x+'</option>').join('')+'</select>'+ (task?'<div class="task"><strong>'+escapeHtml(task.id)+'</strong><p>'+escapeHtml(task.title)+'</p><p>Situação: '+escapeHtml(task.status)+'</p></div>':'<p class="muted">Nenhuma tarefa demonstrativa cadastrada para este executor.</p>'):'<p class="muted">Tela experimental. Os controles operacionais serão testados sem ligação com a produção.</p>';content.innerHTML='<div class="pane"><h2>'+escapeHtml(title)+'</h2>'+extra+'<div class="spacer"></div><p class="testmark">AMBIENTE DE TESTES — DADOS ILUSTRATIVOS</p></div>'}content.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>change(b.dataset.go)));content.querySelectorAll('[data-month]').forEach(b=>b.addEventListener('click',()=>changeMonth(Number(b.dataset.month))));content.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{selectedDay=Number(b.dataset.day);render()}));let sel=$('executor');if(sel)sel.addEventListener('change',e=>{executor=e.target.value;if(section==='execucao')render()});let acomp=$('acomp');if(acomp)acomp.addEventListener('click',()=>{if(executor)change('execucao');else alert('Selecione um executor.')})} $('home').onclick=()=>change('inicio');$('menu').onchange=e=>{page=Number(e.target.value);render()};$('prev').onclick=()=>{if(page>0){page--;render()}};$('next').onclick=()=>{if(page<sections[section].length-1){page++;render()}};render();
</script></body></html>
